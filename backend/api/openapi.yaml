        speed_mps: { type: number }
        client_at: { type: string, format: date-time, description: "Device clock, diagnostics only" }
        mocked: { type: boolean, description: "Android reports the location as mocked (fraud check)" }
    DriverPresence:
      type: object
      required: [driver_id, location, h3, state, services, vehicle_classes, at]
      properties:
        driver_id: { type: string }
        location: { $ref: "#/components/schemas/Point" }
        h3: { type: string, description: H3 resolution-9 cell }
        heading: { type: number }
        speed_mps: { type: number }
        state: { type: string, enum: [IDLE, OFFERED, ON_TRIP] }
        services: { type: array, items: { type: string } }
        vehicle_classes: { type: array, items: { type: string } }
        vehicle_id: { type: string }
        trip_id: { type: string }
        at: { type: string, format: date-time, description: Last ping (server time) }
    DriverStatus:
      type: object
      required: [online, holds]
      properties:
        online: { type: boolean }
        presence: { $ref: "#/components/schemas/DriverPresence" }
        holds: { type: array, items: { $ref: "#/components/schemas/Hold" }, description: "Why the driver cannot go online (empty = free)" }
    Country:
      type: object
      required: [code, name, currency, timezone, area_term, status, area_count, map]
      properties:
        code: { type: string }
        name: { type: object, additionalProperties: { type: string } }
        currency: { type: string }
        timezone: { type: string }
        area_term: { type: object, additionalProperties: { type: string }, description: "What the country calls its areas (Region, County, State), by locale" }
        regulator: { type: string }
        payment_gateway: { type: string }
        emergency_phone: { type: string }
        map: { type: object, required: [lat, lng, zoom], properties: { lat: { type: number }, lng: { type: number }, zoom: { type: integer } } }
        status: { type: string, enum: [ACTIVE, DRAFT] }
        area_count: { type: integer }
    Area:
      type: object
      required: [id, country, code, name, status, surge_enabled, surge_max, cell_count, cells, bbox, updated_at]
      properties:
        id: { type: string, format: uuid }
        country: { type: string }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, DRAFT, ARCHIVED] }
        surge_enabled: { type: boolean }
        surge_max: { type: [string, "null"], description: "Surge cap for the area (1.00 to 2.00); null = tariff caps only" }
        cell_count: { type: integer }
        cells: { type: array, items: { type: string }, description: "Compacted H3 cells (resolution ≤ 7)" }
        bbox: { type: array, items: { type: number }, minItems: 4, maxItems: 4, description: "west, south, east, north" }
        updated_at: { type: string, format: date-time }
    AreaRef:
      type: object
      required: [id, code, name, country]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        country: { type: string }
    AreaInput:
      type: object
      required: [country, code, name, reason]
      properties:
        country: { type: string }
        code: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
        name: { type: string }
        surge_enabled: { type: boolean }
        surge_max: { type: string }
        reason: { type: string, minLength: 1 }
    AreaUpdate:
      type: object
      required: [reason]
      properties:
        name: { type: string }
        status: { type: string, enum: [ACTIVE, DRAFT, ARCHIVED] }
        surge_enabled: { type: boolean }
        surge_max: { type: [string, "null"] }
        reason: { type: string, minLength: 1 }
    Hold:
      type: object
      required: [id, kind, cause, reason, since]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [DEBT, MANUAL, DOCUMENT] }
        cause: { type: string, enum: [HARD_LIMIT, SOFT_LIMIT_OVERDUE, STAFF, DOCUMENT_EXPIRED] }
        reason: { type: [string, "null"] }
        since: { type: string, format: date-time }
    DebtLimits:
      type: object
      required: [soft_limit, hard_limit, soft_grace_days, min_payin]
      properties:
        soft_limit: { $ref: "#/components/schemas/Money" }
        hard_limit: { $ref: "#/components/schemas/Money" }
        soft_grace_days: { type: integer }
        min_payin: { $ref: "#/components/schemas/Money" }
    Payin:
      type: object
      required: [id, driver_id, status, failure_code, amount, currency, phone, gateway, created_at, completed_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        driver_id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, COLLECTED, FAILED] }
        failure_code: { type: [string, "null"], enum: [INSUFFICIENT_FUNDS, REJECTED_BY_USER, EXPIRED, GATEWAY_ERROR] }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        phone: { type: string }
        gateway: { type: string }
        provider_ref: { type: string }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        expires_at: { type: string, format: date-time }
        purpose: { type: string, enum: [DRIVER_DEBT, RIDE_FARE] }
        trip_id: { type: string, format: uuid, description: "The trip a fare belongs to (payer is then the rider)" }
    AdminPayin:
      allOf:
        - $ref: "#/components/schemas/Payin"
        - type: object
          properties:
            name: { type: [string, "null"] }
    ActiveHold:
      type: object
      required: [hold, driver_id, name, phone, debt]
      properties:
        hold: { $ref: "#/components/schemas/Hold" }
        driver_id: { type: string, format: uuid }
        name: { type: [string, "null"] }
        phone: { type: string }
        debt: { $ref: "#/components/schemas/Money" }
    Point:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
    Money:
      type: string
      description: Decimal amount as a string, e.g. "19040.00"
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
    GeofenceShape:
      type: object
      properties:
        geometry: { type: object, additionalProperties: true, description: "GeoJSON Polygon or MultiPolygon, [lng, lat]" }
        center: { type: object, properties: { lat: { type: number }, lng: { type: number } } }
        radius_m: { type: integer, minimum: 50, maximum: 5000 }
    GeofenceHit:
      type: object
      required: [id, kind, name, version]
      properties:
        id: { type: string }
        kind: { type: string }
        name: { type: string }
        version: { type: integer }
        country: { type: string }
    Geofence:
      type: object
      required: [id, country, kind, code, name, status, version, area_m2, vertex_count, bbox, updated_at]
      properties:
        id: { type: string, format: uuid }
        country: { type: string }
        kind: { type: string, enum: [DISTRICT, ZONE, PLACE] }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE, ARCHIVED] }
        version: { type: integer }
        geometry:
          type: object
          properties:
            type: { type: string }
            coordinates: { type: array, items: { type: array, items: { type: array, items: { type: array, items: { type: number } } } } }
        center: { type: object, properties: { lat: { type: number }, lng: { type: number } } }
        radius_m: { type: integer }
        area_m2: { type: number }
        vertex_count: { type: integer }
        bbox: { type: array, items: { type: number }, minItems: 4, maxItems: 4 }
        profile: { type: object, properties: { id: { type: string }, name: { type: string }, status: { type: string } } }
        updated_at: { type: string, format: date-time }
        versions:
          type: array
          items:
            type: object
            properties:
              version: { type: integer }
              created_by: { type: [string, "null"] }
              reason: { type: string }
              created_at: { type: string, format: date-time }
    ProfileTerms:
      type: object
      description: "Money rules. On a region's profile, null means inherit the default's, and the tax, debt and cash-out rules must be null."
      properties:
        commission_rate: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        booking_fee: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        waiting_cap_rate: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        fare_rounding: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        cancel_free_s: { type: [integer, "null"] }
        no_show_after_s: { type: [integer, "null"] }
        cancel_driver_share: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        vat_rate: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        vat_base: { type: [string, "null"], enum: [COMMISSION, GROSS_FARE] }
        levy_rate: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        levy_borne_by: { type: [string, "null"], enum: [PLATFORM, DRIVER, RIDER] }
        debt_soft_limit: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        debt_hard_limit: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        debt_soft_grace_days: { type: [integer, "null"] }
        payin_min_amount: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        payout_min_amount: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        payout_auto_approve: { type: [boolean, "null"] }
    ChargeRule:
      type: object
      required: [code, label, category, amount_type, amount, recipient, applies_when]
      properties:
        code: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,31}$" }
        label: { type: object, required: [en, sw], properties: { en: { type: string, maxLength: 40 }, sw: { type: string, maxLength: 40 } } }
        category: { type: string, enum: [TOLL, PARKING, LEVY, AIRPORT_FEE, ENTRY_FEE, NIGHT, OTHER] }
        amount_type: { type: string, enum: [FLAT, PER_KM, PERCENT_OF_FARE] }
        amount: { $ref: "#/components/schemas/Money" }
        min_amount: { $ref: "#/components/schemas/Money" }
        max_amount: { $ref: "#/components/schemas/Money" }
        recipient: { type: string, enum: [FARE, PLATFORM, DRIVER, THIRD_PARTY], description: "FARE: split like the fare; DRIVER: passed through; THIRD_PARTY: owed to the payee" }
        payee_id: { type: string, format: uuid }
        taxable: { type: boolean, description: "PLATFORM only: VAT is included in the amount" }
        applies_when: { type: string, enum: [PICKUP, DROPOFF, EITHER, BOTH, ROUTE_CROSSES] }
        services: { type: array, items: { type: string } }
        vehicle_classes: { type: array, items: { type: string } }
        on_fixed_routes: { type: boolean }
        days: { type: array, items: { type: integer, minimum: 1, maximum: 7 }, description: "ISO weekdays; empty = every day" }
        from_time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        to_time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
    ProfileVersion:
      type: object
      required: [id, profile_id, version, effective_from, terms, charges, content_hash, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        profile_id: { type: string, format: uuid }
        version: { type: integer }
        effective_from: { type: string, format: date-time }
        terms: { $ref: "#/components/schemas/ProfileTerms" }
        charges: { type: array, items: { $ref: "#/components/schemas/ChargeRule" } }
        content_hash: { type: string }
        published_by: { type: [string, "null"] }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    ProfileScope:
      type: object
      required: [assignment_id, profile_id, kind, id, name, priority, valid_from, reason]
      properties:
        assignment_id: { type: string, format: uuid }
        profile_id: { type: string, format: uuid }
        kind: { type: string, enum: [COUNTRY, AREA, DISTRICT, ZONE, PLACE] }
        id: { type: string }
        name: { type: string }
        priority: { type: integer }
        valid_from: { type: string, format: date-time }
        valid_to: { type: [string, "null"], format: date-time }
        reason: { type: string }
    ProfileEvent:
      type: object
      required: [at, kind]
      properties:
        at: { type: string, format: date-time }
        kind: { type: string }
        version: { type: [integer, "null"] }
        assignment_id: { type: [string, "null"] }
        actor_id: { type: [string, "null"] }
        actor_name: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        data: { type: object, additionalProperties: true }
    PricingProfile:
      type: object
      required: [id, country, name, description, is_default, status, scopes, charges_count, updated_at]
      properties:
        id: { type: string, format: uuid }
        country: { type: string }
        name: { type: string }
        description: { type: string }
        is_default: { type: boolean }
        status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE] }
        active_from: { type: [string, "null"], format: date-time }
        active_until: { type: [string, "null"], format: date-time }
        current_version: { type: [object, "null"], properties: { id: { type: string }, version: { type: integer }, effective_from: { type: string, format: date-time } } }
        next_version: { type: [object, "null"], properties: { id: { type: string }, version: { type: integer }, effective_from: { type: string, format: date-time } } }
        charges_count: { type: integer }
        scopes: { type: array, items: { $ref: "#/components/schemas/ProfileScope" } }
        updated_at: { type: string, format: date-time }
        versions: { type: array, items: { $ref: "#/components/schemas/ProfileVersion" } }
        assignments: { type: array, items: { $ref: "#/components/schemas/ProfileScope" } }
        events: { type: array, items: { $ref: "#/components/schemas/ProfileEvent" } }
    ChargePayee:
      type: object
      required: [id, country, name, kind, reference, status]
      properties:
        id: { type: string, format: uuid }
        country: { type: string }
        name: { type: string }
        kind: { type: string }
        reference: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    PricingRecordRef:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        version_id: { type: string }
        version: { type: integer }
        content_hash: { type: string }
    PricingRecord:
      type: object
      required: [trip_id, profile, scope, terms, charges, trace, config, source, stage, created_at]
      properties:
        trip_id: { type: string, format: uuid }
        quote_id: { type: [string, "null"] }
        country: { type: [string, "null"] }
        profile: { $ref: "#/components/schemas/PricingRecordRef" }
        scope: { type: object, properties: { kind: { type: string }, id: { type: string }, name: { type: string } } }
        default_profile: { oneOf: [{ $ref: "#/components/schemas/PricingRecordRef" }, { type: "null" }] }
        terms: { type: object, additionalProperties: true, description: "The merged rules the trip was priced and split under" }
        charges:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              label: { type: object, properties: { en: { type: string }, sw: { type: string } } }
              category: { type: string }
              recipient: { type: string }
              payee_id: { type: string }
              taxable: { type: boolean }
              applies_when: { type: string }
              matched_at: { type: string }
              amount: { $ref: "#/components/schemas/Money" }
        trace:
          type: object
          additionalProperties: true
          description: "Why this profile: every candidate at the pickup with its outcome (WON, LOWER_PRECEDENCE, INACTIVE, DRAFT, OUT_OF_WINDOW, NO_VERSION_IN_FORCE, TIE_BROKEN)"
        config: { type: object, additionalProperties: true }
        source: { type: string, enum: [LIVE, BACKFILL, FALLBACK] }
        stage: { type: string, enum: [QUOTED, FINAL] }
        final: { type: [object, "null"], additionalProperties: true }
        record_hash: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        finalized_at: { type: [string, "null"], format: date-time }
        seal_valid: { type: [boolean, "null"], description: "Whether the stored hash still matches the record" }
    TripRefunds:
      type: object
      required: [paid, refunded, refundable, currency, refunds]
      properties:
        paid: { $ref: "#/components/schemas/Money" }
        refunded: { $ref: "#/components/schemas/Money" }
        refundable: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        refunds:
          type: array
          items:
            type: object
            required: [id, trip_id, amount, currency, borne_by, reason, created_at, status]
            properties:
              id: { type: string, format: uuid }
              trip_id: { type: string, format: uuid }
              amount: { $ref: "#/components/schemas/Money" }
              currency: { type: string }
              borne_by: { type: string, enum: [PLATFORM, DRIVER] }
              reason: { type: string }
              created_by: { type: [string, "null"] }
              created_at: { type: string, format: date-time }
              status: { type: string, enum: [OWED, PAID] }
              paid_at: { type: [string, "null"], format: date-time }
    ConsentDocument:
      type: object
      required: [app, version, title, summary, url, published_at]
      properties:
        app: { type: string, enum: [RIDER, DRIVER] }
        version: { type: integer }
        title: { type: string }
        summary: { type: string }
        url: { type: string, description: "The full Privacy Notice and Terms" }
        published_at: { type: string, format: date-time }
    ConsentStatus:
      type: object
      required: [app, current_version, required]
      properties:
        app: { type: string, enum: [RIDER, DRIVER] }
        current_version: { type: integer }
        accepted_version: { type: [integer, "null"] }
        required: { type: boolean }
    PrivacyRequest:
      type: object
      required: [id, app, kind, status, created_at, due_at, blockers, overdue]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string }
        user_name: { type: [string, "null"] }
        user_phone: { type: string }
        app: { type: string }
        kind: { type: string, enum: [EXPORT, DELETE] }
        status: { type: string, enum: [REQUESTED, IN_PROGRESS, READY, DONE, REJECTED, CANCELLED] }
        reason: { type: [string, "null"], description: "Staff's reason (shown to the person when rejected)" }
        created_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time }
        handled_by: { type: [string, "null"] }
        handled_at: { type: [string, "null"], format: date-time }
        download_expires_at: { type: [string, "null"], format: date-time }
        blockers: { type: array, items: { type: string, enum: [ACTIVE_TRIP, DRIVER_DEBT, DRIVER_BALANCE, OPEN_PAYOUT, RIDER_DUES, OWED_TO_RIDER] } }
        overdue: { type: boolean }
        country: { type: [string, "null"], description: "The person's country (staff scope)" }
    FraudFlag:
      type: object
      required: [id, rule, severity, subject, evidence, hits, status, opened_at, last_seen_at]
      properties:
        id: { type: string, format: uuid }
        country: { type: [string, "null"] }
        rule: { type: string, enum: [GPS_SPOOF, SELF_BOOKING, DRIVER_CANCEL_RATE, DRIVER_NO_SHOW_RATE, RIDER_CANCEL_RATE] }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH] }
        subject:
          type: object
          required: [kind, id, phone]
          properties:
            kind: { type: string, enum: [DRIVER, RIDER] }
            id: { type: string, format: uuid }
            name: { type: [string, "null"] }
            phone: { type: string }
        trip_id: { type: [string, "null"] }
        trip_code: { type: [string, "null"] }
        evidence:
          type: object
          additionalProperties: true
          description: "GPS_SPOOF: {mocked, pairs[{from, to, speed_mps, jump_m}]}; SELF_BOOKING: {signals[{code, severity, detail}]}; rates: {rule, count, of, rate, threshold, trip_ids}"
        hits: { type: integer }
        status: { type: string, enum: [OPEN, DISMISSED, CONFIRMED] }
        opened_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        reviewed_by: { type: [string, "null"] }
        reviewed_at: { type: [string, "null"], format: date-time }
        review_note: { type: [string, "null"] }
    PricingAsOf:
      type: object
      required: [at, profile, scope, default_profile, terms, charges, resolution, approximate, notes]
      properties:
        at: { type: string, format: date-time }
        profile: { $ref: "#/components/schemas/PricingRecordRef" }
        scope: { type: object, properties: { kind: { type: string }, id: { type: string }, name: { type: string } } }
        default_profile: { $ref: "#/components/schemas/PricingRecordRef" }
        terms: { type: object, additionalProperties: true }
        charges:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/ChargeRule" }
              - type: object
                properties:
                  profile_id: { type: string }
                  version: { type: integer }
                  matched_at: { type: string, enum: [PICKUP, DROPOFF, ROUTE] }
        resolution: { type: object, additionalProperties: true, description: "The trace: every candidate with its outcome" }
        approximate: { type: boolean, description: "A region's shape changed after `at` (regions use today's shapes)" }
        notes: { type: array, items: { type: string, enum: [REGION_SHAPE_CHANGED] } }
    PricingTimelineEntry:
      type: object
      required: [assignment_id, profile_id, profile_name, profile_status, kind, id, name, priority, valid_from, reason]
      properties:
        assignment_id: { type: string, format: uuid }
        profile_id: { type: string, format: uuid }
        profile_name: { type: string }
        profile_status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE] }
        kind: { type: string, enum: [COUNTRY, AREA, DISTRICT, ZONE, PLACE] }
        id: { type: string }
        name: { type: string }
        priority: { type: integer }
        valid_from: { type: string, format: date-time }
        valid_to: { type: [string, "null"], format: date-time }
        reason: { type: string }
        close_reason: { type: [string, "null"] }
        assigned_by: { type: [string, "null"] }
        closed_by: { type: [string, "null"] }
    PricingTimeline:
      type: object
      required: [assignments, events]
      properties:
        assignments: { type: array, items: { $ref: "#/components/schemas/PricingTimelineEntry" } }
        events:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/ProfileEvent" }
              - type: object
                required: [profile_id, profile_name]
                properties:
                  profile_id: { type: string, format: uuid }
                  profile_name: { type: string }
    SimulateInput:
      type: object
      required: [service, pickup]
      properties:
        service: { type: string }
        vehicle_class: { type: string }
        pickup: { $ref: "#/components/schemas/Point" }
        dropoff: { $ref: "#/components/schemas/Point" }
        waypoints: { type: array, items: { $ref: "#/components/schemas/Point" } }
        at: { type: string, format: date-time, description: "Within 7 days of now; a past time uses the profile history" }
        preview_profile_id: { type: string, format: uuid, description: "A DRAFT or INACTIVE profile that takes part as if active, in this answer only" }
    PricingSimulation:
      type: object
      required: [country, area, distance_m, duration_s, options, resolution, splits]
      properties:
        country: { type: string }
        area: { type: object, additionalProperties: true }
        distance_m: { type: integer }
        duration_s: { type: integer }
        polyline: { type: string }
        options: { type: array, items: { $ref: "#/components/schemas/QuoteOption" } }
        resolution: { type: object, additionalProperties: true, description: "Profile, scope, default, trace and per-class pinned terms and charges" }
        splits:
          type: object
          description: "Per vehicle class: how the fare would be split"
          additionalProperties: { type: object, additionalProperties: true }
    FareLine:
      type: object
      required: [code, amount]
      properties:
        code: { type: string, enum: [BASE_FARE, SURGE, WAITING, LOADERS, PICKUP_APPROACH, MINIMUM_FARE_ADJUSTMENT, BOOKING_FEE, FIXED_ROUTE, ROUNDING, PREVIOUS_CANCELLATION, CHARGE, MANUAL_PRICE] }
        amount: { $ref: "#/components/schemas/Money" }
        label: { type: object, properties: { en: { type: string }, sw: { type: string } }, description: "The line's own wording (extra charges); show it before any code table" }
        meta: { type: object, additionalProperties: true, description: "CHARGE lines: {charge, category, recipient}" }
    QuoteOption:
      type: object
      required: [vehicle_class, available, pricing_source]
      properties:
        vehicle_class: { type: string }
        available: { type: boolean }
        pricing_source: { type: string, enum: [METERED, FIXED_ROUTE] }
        fixed_route_name: { type: string }
        fixed_route_id: { type: string, format: uuid }
        fare: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        lines: { type: array, items: { $ref: "#/components/schemas/FareLine" } }
        unavailable_reason: { type: string }
        waiting_grace_s: { type: integer, description: "Free waiting at the pickup, seconds" }
        waiting_rate_per_min: { $ref: "#/components/schemas/Money" }
        waiting_cap: { $ref: "#/components/schemas/Money" }
        cancellation_fee: { $ref: "#/components/schemas/Money" }
        cancel_free_s: { type: integer }
        no_show_after_s: { type: integer }
        cancel_driver_share: { type: string }
    Quote:
      type: object
      required: [quote_id, service, route, surge_multiplier, options, expires_at, country, area]
      properties:
        country: { type: string }
        area: { $ref: "#/components/schemas/AreaRef" }
        quote_id: { type: string, format: uuid }
        service: { type: string }
        route:
          type: object
          required: [distance_m, duration_s, provider]
          properties:
            distance_m: { type: integer }
            duration_s: { type: integer }
            polyline: { type: string }
            provider: { type: string }
        surge_multiplier: { $ref: "#/components/schemas/Money" }
        options: { type: array, items: { $ref: "#/components/schemas/QuoteOption" } }
        expires_at: { type: string, format: date-time }
    Me:
      type: object
      required: [user_id, phone, email_verified, roles, created_at, brand, app]
      properties:
        user_id: { type: string, format: uuid }
        phone: { type: string }
        full_name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        email_verified: { type: boolean }
        locale: { type: [string, "null"] }
        photo_url: { type: [string, "null"] }
        roles: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        brand: { type: string }
        app: { $ref: "#/components/schemas/AppKind" }
        consent: { $ref: "#/components/schemas/ConsentStatus" }
    Place:
      type: object
      required: [id, kind, label, address, lat, lng, use_count, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [HOME, WORK, OTHER] }
        label: { type: string }
        address: { type: string }
        lat: { type: number }
        lng: { type: number }
        use_count: { type: integer }
        updated_at: { type: string, format: date-time }
    PlaceInput:
      type: object
      required: [kind, address, lat, lng]
      properties:
        kind: { type: string, enum: [HOME, WORK, OTHER] }
        label: { type: string }
        address: { type: string }
        lat: { type: number }
        lng: { type: number }
    CancelReason:
      type: object
      required: [key, label]
      properties:
        key: { type: string }
        label: { $ref: "#/components/schemas/LocalizedText" }
        free_text: { type: boolean }
    TripStatus:
      type: string
      enum: [SCHEDULED, REQUESTED, OFFERED, ACCEPTED, EN_ROUTE_TO_PICKUP, ARRIVED_AT_PICKUP, IN_TRANSIT, ARRIVED_AT_DROPOFF, AWAITING_PAYMENT, COMPLETED, CANCELLED_BY_RIDER, CANCELLED_BY_DRIVER, CANCELLED_BY_STAFF, NO_DRIVER_FOUND, EXPIRED]
    TripStop:
      type: object
      required: [seq, kind, location]
      properties:
        seq: { type: integer }
        kind: { type: string, enum: [PICKUP, DROPOFF, WAYPOINT] }
        location: { $ref: "#/components/schemas/Point" }
        address: { type: string }
        arrived_at: { type: string, format: date-time }
    TripCreate:
      type: object
      required: [quote_id, vehicle_class, payment_method]
      properties:
        quote_id: { type: string, format: uuid }
        vehicle_class: { type: string }
        contacts: { $ref: "#/components/schemas/TripContacts" }
        scheduled_for: { type: string, format: date-time, description: "Book ahead: 30 minutes to 7 days from now. Matching starts 15 minutes before." }
        payment_method: { type: string, enum: [CASH, MOBILE_MONEY, CARD, WALLET], description: "CARD and WALLET are refused (PAYMENT_METHOD_UNAVAILABLE) until a card gateway is configured" }
        stops:
          type: array
          items:
            type: object
            required: [kind]
            properties:
              kind: { type: string, enum: [PICKUP, WAYPOINT, DROPOFF] }
              address: { type: string }
        notes: { type: string }
    Trip:
      type: object
      required: [id, code, service, vehicle_class, rider_id, status, lifecycle, estimated_fare, currency, payment_method, stops, seq, allowed_transitions, requested_at, timestamps, country, area]
      properties:
        country: { type: string }
        area: { oneOf: [{ $ref: "#/components/schemas/AreaRef" }, { type: "null" }] }
        id: { type: string, format: uuid }
        code: { type: string }
        service: { type: string }
        vehicle_class: { type: string }
        rider_id: { type: string, format: uuid }
        driver_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/TripStatus" }
        lifecycle: { type: object, additionalProperties: true }
        attributes: { type: object, additionalProperties: true }
        quote_option: { $ref: "#/components/schemas/QuoteOption" }
        pricing_source: { type: string }
        estimated_fare: { $ref: "#/components/schemas/Money" }
        final_fare: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        payment_method: { type: string }
        route_distance_m: { type: integer }
        route_duration_s: { type: integer }
        notes: { type: string }
        stops: { type: array, items: { $ref: "#/components/schemas/TripStop" } }
        seq: { type: integer }
        allowed_transitions: { type: array, items: { $ref: "#/components/schemas/TripStatus" } }
        requested_at: { type: string, format: date-time }
        timestamps: { type: object, additionalProperties: { type: string, format: date-time } }
        fees: { $ref: "#/components/schemas/FeeBreakdown" }
        scheduled_for: { type: string, format: date-time }
        adjustments: { type: array, items: { $ref: "#/components/schemas/FareLine" }, description: "Charges added during the ride (WAITING), included in final_fare" }
        cancellation_fee: { $ref: "#/components/schemas/Money" }
        cancel_fee_now: { $ref: "#/components/schemas/Money" }
        contacts: { $ref: "#/components/schemas/TripContacts" }
        rider: { $ref: "#/components/schemas/Party" }
        driver: { $ref: "#/components/schemas/Party" }
        driver_location: { $ref: "#/components/schemas/DriverLocation" }
        cancel_reason: { type: string }
        payment_status: { type: string, enum: [DUE, PENDING, FAILED, COLLECTED, CASH_CONFIRMED], description: "Set once the ride ends" }
        payment: { $ref: "#/components/schemas/TripPayment" }
    Receipt:
      type: object
      description: One immutable receipt per completed trip; lines add up to the total.
      required: [id, number, issued_at, trip_id, currency, total, lines, taxes, payment, issuer, trip, driver]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: "2026-000123" }
        issued_at: { type: string, format: date-time }
        trip_id: { type: string, format: uuid }
        currency: { type: string }
        total: { $ref: "#/components/schemas/Money" }
        lines: { type: array, items: { $ref: "#/components/schemas/ReceiptLine" } }
        taxes:
          type: object
          required: [vat, levy, included]
          properties:
            vat: { $ref: "#/components/schemas/Money" }
            levy: { $ref: "#/components/schemas/Money" }
            included: { type: boolean, description: "Taxes are inside the total, never added on top" }
        payment:
          type: object
          required: [method, status]
          properties:
            method: { type: string, enum: [CASH, MOBILE_MONEY] }
            status: { type: string, enum: [COLLECTED, CASH_CONFIRMED] }
            reference: { type: string }
        issuer:
          type: object
          required: [name, country, timezone]
          properties:
            name: { type: string }
            legal_entity: { type: string }
            support_phone: { type: string }
            support_email: { type: string }
            country: { type: string }
            timezone: { type: string }
        trip:
          type: object
          required: [code, service, vehicle_class, pickup, dropoff, completed_at]
          properties:
            code: { type: string }
            service: { type: string }
            vehicle_class: { type: string }
            pickup: { type: string }
            dropoff: { type: string }
            distance_m: { type: integer }
            duration_s: { type: integer }
            started_at: { type: string, format: date-time }
            completed_at: { type: string, format: date-time }
        driver:
          type: object
          required: [name]
          properties:
            name: { type: string }
            plate: { type: string }
    ReceiptLine:
      type: object
      required: [code, label, amount]
      properties:
        code: { type: string }
        label: { $ref: "#/components/schemas/LocalizedText" }
        amount: { $ref: "#/components/schemas/Money" }
        meta: { type: object, additionalProperties: true }
    ReceiptLink:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string }
        expires_at: { type: string, format: date-time }
    RegulatorStatus:
      type: object
      required: [country, regulator, adapter, configured, enabled, fail_closed, pending, stuck, accepted_today, skipped_today]
      properties:
        country: { type: string }
        regulator: { type: string, description: "The country's regulator key from the brand file (e.g. latra)" }
        adapter: { type: string, description: "fake, a real adapter (e.g. cets) or pending (queued, not sent)" }
        configured: { type: boolean }
        enabled: { type: boolean }
        fail_closed: { type: boolean }
        pending: { type: integer }
        stuck: { type: integer }
        accepted_today: { type: integer }
        skipped_today: { type: integer }
        last_accepted_at: { type: string, format: date-time }
        last_error: { type: string }
    RegulatorSubmission:
      type: object
      required: [id, country, regulator, kind, subject_key, subject_label, status, attempts, next_attempt_at, stuck, created_at]
      properties:
        id: { type: string, format: uuid }
        country: { type: string }
        regulator: { type: string }
        kind: { type: string, enum: [DRIVER, VEHICLE, TRIP, DAILY_REPORT] }
        subject_key: { type: string }
        subject_label: { type: string }
        driver_id: { type: string, format: uuid }
        trip_id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, ACCEPTED, SKIPPED] }
        attempts: { type: integer }
        next_attempt_at: { type: string, format: date-time }
        last_code: { type: string }
        last_error: { type: string }
        reference: { type: string }
        accepted_at: { type: string, format: date-time }
        stuck: { type: boolean }
        created_at: { type: string, format: date-time }
    TripPayment:
      type: object
      description: Where a finished ride's fare stands. A trip is COMPLETED only once COLLECTED or CASH_CONFIRMED.
      required: [status, method, amount, currency, cash_chosen]
      properties:
        status: { type: string, enum: [DUE, PENDING, FAILED, COLLECTED, CASH_CONFIRMED] }
        method: { type: string, enum: [CASH, MOBILE_MONEY] }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        cash_chosen: { type: boolean, description: "The rider said they will pay cash" }
        prompt: { $ref: "#/components/schemas/FarePrompt" }
    FarePrompt:
      type: object
      description: The latest mobile-money prompt for the fare (while the trip awaits payment)
      required: [status, phone, amount, expires_at, prompts_used, prompts_left]
      properties:
        status: { type: string, enum: [PENDING, COLLECTED, FAILED] }
        failure_code: { type: string, enum: [INSUFFICIENT_FUNDS, REJECTED_BY_USER, EXPIRED, GATEWAY_ERROR] }
        phone: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        expires_at: { type: string, format: date-time }
        prompts_used: { type: integer }
        prompts_left: { type: integer }
    TripEvent:
      type: object
      required: [seq, type, actor_kind, payload, at]
      properties:
        seq: { type: integer }
        type: { type: string }
        actor_kind: { type: string }
        payload: { type: object, additionalProperties: true }
        at: { type: string, format: date-time }
    LocalizedText:
      type: object
      additionalProperties: { type: string }
      example: { en: "Taxi", sw: "Teksi" }
