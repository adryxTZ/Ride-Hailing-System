openapi: 3.1.0
info:
  title: Platform API
  version: 0.2.0
  description: >
    Generic multi-service mobility & logistics platform. Brand name, colours and
    catalogue are data served by this API; nothing here is brand-specific.
servers:
  - url: https://{apiHost}/v1
    variables:
      apiHost:
        default: localhost:8080
security:
  - bearerAuth: []
tags:
  - name: public
  - name: auth
  - name: catalog
  - name: rider
  - name: driver
  - name: admin
  - name: messaging
  - name: onboarding
  - name: files
  - name: safety
paths:
  /health:
    get:
      tags: [public]
      security: []
      operationId: getHealth
      summary: Liveness
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /ready:
    get:
      tags: [public]
      security: []
      operationId: getReady
      summary: Readiness (DB + Redis reachable, migrations applied)
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503": { $ref: "#/components/responses/Error" }
  /openapi.yaml:
    get:
      tags: [public]
      security: []
      operationId: getOpenApiSpec
      summary: This contract, served by the backend so clients can be generated from a running instance
      responses:
        "200":
          description: OpenAPI document
          content:
            application/yaml:
              schema: { type: string }
  /app/config:
    get:
      tags: [public]
      security: []
      operationId: getAppConfig
      summary: Brand, published theme, feature flags and minimum app version
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Config
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppConfig" }
        "304": { description: Not modified }
  /theme/presets:
    get:
      tags: [public]
      security: []
      operationId: listThemePresets
      summary: Curated palette gallery
      responses:
        "200":
          description: Presets
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ThemePreset" } }
  /services:
    get:
      tags: [catalog]
      security: []
      operationId: listServices
      summary: Active services (taxi) with vehicle classes and request schema
      responses:
        "200":
          description: Services
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Service" } }
  /services/{key}:
    get:
      tags: [catalog]
      security: []
      operationId: getService
      summary: One service by key (also reachable when HIDDEN, for previews)
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "404": { $ref: "#/components/responses/Error" }
  /pricing/engines:
    get:
      tags: [catalog]
      security: []
      operationId: listPricingEngines
      summary: Pricing modules an operator can choose per tariff, with their settings schemas
      responses:
        "200":
          description: Engines
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [key, name, settings_schema]
                      properties:
                        key: { type: string, example: per_km_min }
                        name: { type: string }
                        settings_schema: { type: object, additionalProperties: true }
  /quotes:
    post:
      tags: [rider]
      security: [{}, { bearerAuth: [] }]
      operationId: createQuote
      summary: Price every eligible vehicle class of a service for a route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service, pickup]
              properties:
                service: { type: string, example: taxi }
                pickup: { $ref: "#/components/schemas/Point" }
                dropoff: { $ref: "#/components/schemas/Point" }
                waypoints:
                  type: array
                  maxItems: 3
                  items: { $ref: "#/components/schemas/Point" }
                  description: Stops between pickup and drop-off, in order
                attributes:
                  type: object
                  additionalProperties: true
                  description: Fields defined by the service's request_schema
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /trips:
    post:
      tags: [rider]
      operationId: createTrip
      summary: Book a trip from a quote option
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripCreate" }
      responses:
        "201":
          description: Trip created (REQUESTED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      tags: [rider]
      operationId: listTrips
      summary: Recent trips of the caller
      responses:
        "200":
          description: Trips
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Trip" } }
  /trips/active:
    get:
      tags: [rider]
      operationId: getActiveTrip
      summary: The caller's in-progress trip, or null
      responses:
        "200":
          description: Active trip
          content:
            application/json:
              schema:
                type: object
                required: [trip]
                properties:
                  trip:
                    oneOf:
                      - $ref: "#/components/schemas/Trip"
                      - type: "null"
  /trips/{id}:
    get:
      tags: [rider, driver]
      operationId: getTrip
      summary: One trip the caller participates in
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /trips/{id}/events:
    get:
      tags: [rider, driver]
      operationId: listTripEvents
      summary: Event log after a sequence number (replay after reconnect)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: after_seq, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/TripEvent" } }
  /trips/{id}/cancel:
    post:
      tags: [rider]
      operationId: cancelTrip
      summary: Cancel before the service starts
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, description: A key from /config/cancel-reasons }
                note: { type: string }
      responses:
        "200":
          description: Cancelled trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "409": { $ref: "#/components/responses/Error" }
  /trips/{id}/receipt:
    get:
      tags: [rider, driver]
      operationId: getTripReceipt
      summary: The trip's receipt (rider or driver; issued when the trip completed, never changes)
      description: Served with an ETag and `Cache-Control private, immutable`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "304": { description: Not modified }
        "404": { $ref: "#/components/responses/Error" }
  /trips/{id}/receipt/link:
    get:
      tags: [rider, driver]
      operationId: getTripReceiptLink
      summary: A signed link to the receipt PDF (valid 15 minutes)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: lang, in: query, schema: { type: string, enum: [en, sw] }, description: "Default: Accept-Language" }
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiptLink" }
        "404": { $ref: "#/components/responses/Error" }
  /receipts/{id}/pdf:
    get:
      tags: [public]
      operationId: getReceiptPdf
      summary: The receipt PDF behind a signed link (no session; RECEIPT_LINK_INVALID when tampered or expired)
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: lang, in: query, required: true, schema: { type: string, enum: [en, sw] } }
        - { name: exp, in: query, required: true, schema: { type: string } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: A4 PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Error" }
  /admin/trips/{id}/receipt:
    get:
      tags: [admin]
      operationId: getAdminTripReceipt
      summary: A trip's receipt (staff)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/trips/{id}/receipt/link:
    get:
      tags: [admin]
      operationId: getAdminTripReceiptLink
      summary: A signed link to a trip's receipt PDF (staff)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: lang, in: query, schema: { type: string, enum: [en, sw] } }
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiptLink" }
        "404": { $ref: "#/components/responses/Error" }
  /trips/{id}/payment/prompt:
    post:
      tags: [rider]
      operationId: promptFare
      summary: Send another mobile-money prompt for a finished ride's fare (at most 3 per trip)
      description: |
        Allowed while the trip is AWAITING_PAYMENT and no prompt is open. The prompt
        goes to the account phone unless `phone` names another number. Errors:
        PAYMENT_NOT_DUE, FARE_PROMPT_PENDING (409), FARE_PROMPT_LIMIT, PAYIN_RATE_LIMITED (429),
        FARE_BELOW_GATEWAY_MINIMUM (409, pay cash), GATEWAY_UNAVAILABLE (502).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, schema: { type: string, minLength: 8, maxLength: 64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string, description: "Another number to prompt (default: the account phone)" }
      responses:
        "202":
          description: Prompt sent; the trip with payment.status PENDING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /trips/{id}/payment/cash:
    post:
      tags: [rider]
      operationId: chooseCash
      summary: Pay the driver in cash instead (the driver then confirms it)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The trip with payment.cash_chosen true
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /trips/{id}/messages:
    get:
      tags: [messaging]
      operationId: listTripMessages
      summary: The trip's chat (marks the other side's lines read) plus canned replies for the caller
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Chat page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatPage" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [messaging]
      operationId: sendTripMessage
      summary: Send a chat line to the other participant (open from driver assignment until the trip ends)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "409": { $ref: "#/components/responses/Error" }
  /trips/{id}/ratings:
    get:
      tags: [messaging]
      operationId: listTripRatings
      summary: Ratings given on a trip
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Ratings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Rating" } }
  /trips/{id}/rating:
    post:
      tags: [messaging]
      operationId: rateTrip
      summary: Rate the other participant of a completed trip (once per side)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RatingInput" }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rating" }
        "409": { $ref: "#/components/responses/Error" }
  /me/rating:
    get:
      tags: [messaging]
      operationId: getMyRating
      summary: The caller's average rating
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RatingSummary" }
  /me/dues:
    get:
      tags: [rider]
      operationId: getMyDues
      summary: What the rider owes from earlier cancellations (added to the next trip)
      responses:
        "200":
          description: Amount owed
          content:
            application/json:
              schema:
                type: object
                required: [amount]
                properties:
                  amount: { $ref: "#/components/schemas/Money" }
  /me/devices:
    post:
      tags: [messaging]
      operationId: registerDevice
      summary: Register this phone's push token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceInput" }
      responses:
        "204": { description: Registered }
        "400": { $ref: "#/components/responses/Error" }
  /me/devices/{token}:
    delete:
      tags: [messaging]
      operationId: unregisterDevice
      summary: Forget a push token (sign-out)
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
  /me/trusted-contacts:
    get:
      tags: [safety]
      operationId: listTrustedContacts
      summary: People alerted when the rider presses SOS
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrustedContactList" }
    put:
      tags: [safety]
      operationId: saveTrustedContacts
      summary: Replace the trusted contacts (up to 3)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrustedContactList" }
      responses:
        "200":
          description: Saved contacts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrustedContactList" }
        "400": { $ref: "#/components/responses/Error" }
  /trips/{id}/share:
    post:
      tags: [safety]
      operationId: shareTrip
      summary: Public link to follow the trip live (created once; expires an hour after the trip ends)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareLink" }
  /trips/{id}/sos:
    post:
      tags: [safety]
      operationId: raiseSos
      summary: Emergency on the trip — texts the trusted contacts the live link and alerts staff
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                location: { $ref: "#/components/schemas/Point" }
      responses:
        "201":
          description: Alert raised
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SosAlert" }
  /share/{token}:
    get:
      tags: [safety]
      security: []
      operationId: getSharedTrip
      summary: The live trip behind a share link (no phone numbers or fares)
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTrip" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /admin/sos:
    get:
      tags: [admin]
      operationId: listSosAlerts
      summary: SOS alerts (open ones unless all=1)
      parameters:
        - { name: all, in: query, schema: { type: string, enum: ["1"] } }
        - { name: country, in: query, schema: { type: string }, description: "Limit to a country (staff limited to countries always see only theirs)" }
        - { name: area_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SosAlert" } }
  /admin/sos/{id}/resolve:
    post:
      tags: [admin]
      operationId: resolveSosAlert
      summary: Close an SOS alert with what was done
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution: { type: string, minLength: 1 }
      responses:
        "204": { description: Resolved }
  /config/cancel-reasons:
    get:
      tags: [public]
      security: []
      operationId: listCancelReasons
      summary: Cancellation reasons per audience
      responses:
        "200":
          description: Reasons
          content:
            application/json:
              schema:
                type: object
                required: [rider, driver]
                properties:
                  rider: { type: array, items: { $ref: "#/components/schemas/CancelReason" } }
                  driver: { type: array, items: { $ref: "#/components/schemas/CancelReason" } }
  /auth/otp/request:
    post:
      tags: [auth]
      security: []
      operationId: requestOtp
      summary: Send a one-time sign-in code by SMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, app]
              properties:
                phone: { type: string, description: Local or E.164 format; normalised by the brand's country }
                app: { $ref: "#/components/schemas/AppKind" }
      responses:
        "202":
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [sent] }
                  dev_code: { type: string, description: Present only when the server runs with OTP dev echo }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/otp/verify:
    post:
      tags: [auth]
      security: []
      operationId: verifyOtp
      parameters:
        - $ref: "#/components/parameters/InstallId"
      summary: Exchange a code for a token pair (creates the account on first sign-in)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, app]
              properties:
                phone: { type: string }
                code: { type: string }
                app: { $ref: "#/components/schemas/AppKind" }
      responses:
        "200":
          description: Token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/staff/login:
    post:
      tags: [auth]
      operationId: staffLogin
      summary: Dashboard sign-in with email and password (staff only)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
                location:
                  type: object
                  description: "The browser's position at sign-in, sent only when the person allows it; recorded in the audit log"
                  required: [lat, lng]
                  properties:
                    lat: { type: number }
                    lng: { type: number }
                    accuracy_m: { type: number }
      responses:
        "200":
          description: Tokens for the admin app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Error", description: "INVALID_CREDENTIALS" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error", description: "LOGIN_LOCKED after 5 wrong passwords, for 10 minutes" }
  /auth/refresh:
    post:
      tags: [auth]
      security: []
      operationId: refreshToken
      parameters:
        - $ref: "#/components/parameters/InstallId"
      summary: Rotate the refresh token and get a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token, app]
              properties:
                refresh_token: { type: string }
                app: { $ref: "#/components/schemas/AppKind" }
      responses:
        "200":
          description: Token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [auth]
      security: []
      operationId: logout
      summary: Revoke the session family of this refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "204": { description: Logged out }
  /auth/jwks:
    get:
      tags: [auth]
      security: []
      operationId: getJwks
      summary: Public signing keys (JSON Web Key Set)
      responses:
        "200":
          description: JWKS
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /me:
    get:
      tags: [rider, driver, admin]
      operationId: getMe
      summary: Own profile plus the token's brand and app
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      tags: [rider, driver]
      operationId: updateMe
      summary: Edit name, email or locale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string, minLength: 2, maxLength: 80 }
                email: { type: string, format: email }
                locale: { type: string, enum: [en, sw] }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /drivers/nearby:
    get:
      tags: [rider]
      operationId: listNearbyDrivers
      summary: Available drivers around a point (positions and classes only, no identity)
      description: |
        Reads live presence (Redis) within about 2.8 km. Used to draw cars on the
        rider map and to estimate pickup time per vehicle class.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
        - { name: service, in: query, schema: { type: string } }
        - { name: vehicle_class, in: query, schema: { type: string } }
      responses:
        "200":
          description: Nearby available vehicles, nearest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/NearbyVehicle" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /places/search:
    get:
      tags: [rider, driver]
      operationId: searchPlaces
      summary: Place suggestions as the user types (biased to lat/lng when given)
      description: Fewer than 3 characters returns an empty list. Cached per query and area for a day.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: lng, in: query, schema: { type: number } }
      responses:
        "200":
          description: Suggestions, best first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PlaceResult" } }
        "503": { $ref: "#/components/responses/Error" }
  /places/reverse:
    get:
      tags: [rider, driver]
      operationId: reversePlace
      summary: The name of a coordinate (street or landmark), or null
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
      responses:
        "200":
          description: Place or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  place: { oneOf: [{ $ref: "#/components/schemas/PlaceResult" }, { type: "null" }] }
  /routes:
    get:
      tags: [rider, driver]
      operationId: getRoute
      summary: Road route between two points (distance, duration, encoded polyline)
      description: Cached by ~11 m cells; falls back to an estimate when routing is down.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string }, description: "lat,lng" }
        - { name: to, in: query, required: true, schema: { type: string }, description: "lat,lng" }
        - { name: via, in: query, schema: { type: string }, description: "Up to 3 stops in order: lat,lng|lat,lng" }
      responses:
        "200":
          description: Route
          content:
            application/json:
              schema:
                type: object
                required: [distance_m, duration_s, provider]
                properties:
                  distance_m: { type: integer }
                  duration_s: { type: integer }
                  polyline: { type: string }
                  provider: { type: string }
                  steps: { type: array, items: { $ref: "#/components/schemas/RouteStep" } }
        "400": { $ref: "#/components/responses/Error" }
  /ws:
    get:
      tags: [rider, driver]
      operationId: realtimeSocket
      summary: Realtime websocket (upgrade)
      description: |
        Open the socket, then send {"type":"auth","token":"<access token>"} within 10 s
        (the token is never put in the URL). The server replies {"type":"ready"}.
        Frames addressed to the signed-in user follow, each {type, ts, data}:
        `trip.updated` (data = Trip), `offer.new` (data = Offer, drivers),
        `offer.closed` (data = {trip_id, reason}), `driver.location`
        (data = {trip_id, location, heading, at}, riders). Send {"type":"ping"} to
        get {"type":"pong"}. Delivery is best effort; re-read over HTTP after reconnecting.
      responses:
        "101": { description: Switching protocols }
  /driver/offer:
    get:
      tags: [driver]
      operationId: getCurrentOffer
      summary: The driver's open ride offer, if any (after an app restart)
      responses:
        "200":
          description: Current offer or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  offer: { oneOf: [{ $ref: "#/components/schemas/Offer" }, { type: "null" }] }
        "401": { $ref: "#/components/responses/Error" }
  /driver/offers/{tripId}/accept:
    post:
      tags: [driver]
      operationId: acceptOffer
      summary: Accept a ride offer (atomic; a late or second accept gets 404/409)
      parameters: [{ name: tripId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: The assigned trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /driver/offers/{tripId}/decline:
    post:
      tags: [driver]
      operationId: declineOffer
      summary: Decline a ride offer; the trip goes to the next driver
      parameters: [{ name: tripId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Declined }
        "404": { $ref: "#/components/responses/Error" }
  /driver/trips/active:
    get:
      tags: [driver]
      operationId: getDriverActiveTrip
      summary: The driver's assigned, unfinished trip or null
      responses:
        "200":
          description: Active trip
          content:
            application/json:
              schema:
                type: object
                properties:
                  trip: { oneOf: [{ $ref: "#/components/schemas/Trip" }, { type: "null" }] }
  /driver/trips:
    get:
      tags: [driver]
      operationId: listDriverTrips
      summary: The driver's recent trips, newest first (history and earnings)
      responses:
        "200":
          description: Trips
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Trip" } }
  /driver/wallet:
    get:
      tags: [driver]
      operationId: getDriverWallet
      summary: Wallet balance (negative = owed to the platform) and recent entries
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema:
                type: object
                required: [currency, balance, entries, debt, limits, holds, soft_hold_at, pay_to_unhold, pending_payin]
                properties:
                  currency: { type: string }
                  balance: { $ref: "#/components/schemas/Money" }
                  entries:
                    type: array
                    items:
                      type: object
                      required: [at, kind, reference, memo, amount]
                      properties:
                        at: { type: string, format: date-time }
                        kind: { type: string, description: "trip.completed, trip.cancellation_fee, trip.dues_collected, payin.collected, payout.paid" }
                        reference: { type: string }
                        memo: { type: string }
                        amount: { $ref: "#/components/schemas/Money" }
                  debt: { $ref: "#/components/schemas/Money", description: "What the driver owes (max(0, -balance))" }
                  limits: { $ref: "#/components/schemas/DebtLimits" }
                  holds: { type: array, items: { $ref: "#/components/schemas/Hold" } }
                  soft_hold_at: { type: [string, "null"], format: date-time, description: "When the soft rule holds the driver if the debt stays" }
                  pay_to_unhold: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }], description: "Smallest payment that lifts the DEBT hold; null without one" }
                  pending_payin: { oneOf: [{ $ref: "#/components/schemas/Payin" }, { type: "null" }] }
                  payouts: { $ref: "#/components/schemas/PayoutWallet" }
  /driver/payins:
    post:
      tags: [driver]
      operationId: createPayin
      summary: Pay debt by mobile money (USSD push to the phone)
      description: The gateway prompts the payer for their PIN. Poll GET /driver/payins/{id} or listen for the wallet.updated frame.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: "#/components/schemas/Money", description: "Whole units, between the minimum and the debt" }
                phone: { type: string, description: "Mobile-money number; defaults to the account phone" }
      responses:
        "201":
          description: Payment requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payin" }
        "200":
          description: Same key replayed; the original payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payin" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error", description: "PAYIN_RATE_LIMITED: too many prompts for this driver or number" }
        "502": { $ref: "#/components/responses/Error" }
  /driver/payins/{id}:
    get:
      tags: [driver]
      operationId: getPayin
      summary: One of my payments (polling fallback)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payin" }
        "404": { $ref: "#/components/responses/Error" }
  /payments/webhooks/{gateway}:
    post:
      tags: [partner]
      operationId: paymentWebhook
      summary: Gateway callback (untrusted; only prompts a status re-check)
      security: []
      parameters: [{ name: gateway, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
        "404": { $ref: "#/components/responses/Error" }
  /driver/trips/{id}/transitions:
    post:
      tags: [driver]
      operationId: transitionTrip
      summary: Move the assigned trip one step (must be in allowed_transitions)
      description: "CANCELLED_BY_DRIVER before the ride starts sends the trip back to matching; with reason rider_no_show (after the no-show wait at the pickup) it ends the trip and charges the cancellation fee."
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { $ref: "#/components/schemas/TripStatus" }
                reason: { type: string, enum: [rider_no_show] }
      responses:
        "200":
          description: Trip after the step
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /driver/areas:
    get:
      tags: [driver]
      operationId: getDriverAreas
      summary: "Regions a driver can work in (their country's active areas) and where they are registered; sign-up sends area_id in the profile"
      parameters:
        - { name: country, in: query, schema: { type: string }, description: "Before registration: the country to list (default the brand's home country)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [country, areas, selected, primary]
                properties:
                  country: { type: string }
                  areas: { type: array, items: { $ref: "#/components/schemas/AreaRef" } }
                  selected: { type: array, items: { $ref: "#/components/schemas/AreaRef" } }
                  primary: { type: string }
  /driver/onboarding:
    get:
      tags: [onboarding]
      operationId: getOnboarding
      summary: The driver's sign-up checklist (created on first call)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /driver/onboarding/profile:
    put:
      tags: [onboarding]
      operationId: saveOnboardingProfile
      summary: Name, licence and national ID (while onboarding or after a rejection)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverProfileInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /driver/onboarding/vehicle:
    put:
      tags: [onboarding]
      operationId: saveOnboardingVehicle
      summary: Register or edit the vehicle (needs a new review)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /driver/onboarding/uploads:
    post:
      tags: [onboarding]
      operationId: createUpload
      summary: A signed URL to PUT one document file to (15 minutes)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [content_type], properties: { content_type: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] } } }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /driver/onboarding/documents:
    post:
      tags: [onboarding]
      operationId: addDocument
      summary: Attach an uploaded file as a document (replaces the previous one of that kind)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /driver/onboarding/submit:
    post:
      tags: [onboarding]
      operationId: submitOnboarding
      summary: Send a complete application for review
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/overview:
    get:
      tags: [admin]
      operationId: getAdminOverview
      summary: "Today's numbers: trips, drivers online, reviews, SOS, finance"
      parameters:
        - { name: country, in: query, schema: { type: string }, description: "Scope: country code (default the brand's home country)" }
        - { name: area_id, in: query, schema: { type: string, format: uuid }, description: "Scope: one area of the country" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/live:
    get:
      tags: [admin]
      operationId: getAdminLive
      summary: "Live map: online drivers, waiting requests, surge areas"
      parameters:
        - { name: country, in: query, schema: { type: string }, description: "Scope: country code (default the brand's home country)" }
        - { name: area_id, in: query, schema: { type: string, format: uuid }, description: "Scope: one area of the country" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLive" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/trips:
    get:
      tags: [admin]
      operationId: listAdminTrips
      summary: "Trips, newest first"
      parameters:
        - { name: country, in: query, schema: { type: string }, description: "Scope: country code (default the brand's home country)" }
        - { name: area_id, in: query, schema: { type: string, format: uuid }, description: "Scope: one area of the country" }
        - { name: status, in: query, schema: { type: string, enum: [active, scheduled, completed, cancelled] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: service, in: query, schema: { type: string } }
        - { name: rider_id, in: query, schema: { type: string, format: uuid }, description: "One rider's trips" }
        - { name: driver_id, in: query, schema: { type: string, format: uuid }, description: "One driver's trips" }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTripPage" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/trips/{id}:
    get:
      tags: [admin]
      operationId: getAdminTrip
      summary: "A trip with its event log"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTripDetail" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/trips/{id}/price:
    post:
      tags: [admin]
      operationId: setTripPrice
      summary: "Set a trip's fare by hand before it is paid (trips.price, audited); adds a MANUAL_PRICE line"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason]
              properties:
                amount: { $ref: "#/components/schemas/Money" }
                reason: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: "TRIP_PRICE_LOCKED, PAYMENT_IN_PROGRESS or PRICE_BELOW_FIXED_PARTS", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/trips/{id}/refunds:
    get:
      tags: [admin]
      operationId: getTripRefunds
      summary: "What the rider paid, what was refunded and what can still be refunded"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripRefunds" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      operationId: refundTrip
      summary: "Refund part or all of a completed, paid trip (trips.refund, audited); owed to the rider until Finance pays it"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, schema: { type: string }, description: "A repeated key returns the trip's refunds without refunding again" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, borne_by, reason]
              properties:
                amount: { $ref: "#/components/schemas/Money" }
                borne_by: { type: string, enum: [PLATFORM, DRIVER] }
                reason: { type: string, maxLength: 1000 }
      responses:
        "202": { $ref: "#/components/responses/SentForApproval" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripRefunds" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: "TRIP_NOT_REFUNDABLE or REFUND_TOO_LARGE (details.refundable)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/trips/{id}/cancel:
    post:
      tags: [admin]
      operationId: cancelAdminTrip
      summary: "End a trip from the operations desk (audited)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/riders:
    get:
      tags: [admin]
      operationId: listAdminRiders
      summary: "Riders (with a country, those who booked there)"
      parameters:
        - { name: country, in: query, schema: { type: string }, description: "Scope: country code (default the brand's home country)" }
        - { name: area_id, in: query, schema: { type: string }, description: "Scope: one area of the country" }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "403": { $ref: "#/components/responses/Error" }
  /brand/assets/{key}:
    get:
      tags: [public]
      security: []
      operationId: getBrandAsset
      summary: "A published logo or icon (redirects to a short-lived file link; cache for an hour)"
      parameters:
        - { name: key, in: path, required: true, schema: { type: string }, description: "The rest of the asset path after branding/" }
      responses:
        "302": { description: Redirect to the file }
        "400": { $ref: "#/components/responses/Error" }
  /admin/branding:
    get:
      tags: [admin]
      operationId: getBranding
      summary: "The Branding page: identity, every theme version, presets, allowed fonts, asset slots and radius limits (branding.manage)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandingOverview" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/branding/identity:
    put:
      tags: [admin]
      operationId: setBrandIdentity
      summary: "Change the brand name and contacts (audited; the brand file stops overwriting them)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrandIdentityInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandIdentity" }
        "400": { $ref: "#/components/responses/Error" }
  /admin/branding/preview:
    post:
      tags: [admin]
      operationId: previewBrandColours
      summary: "Derive the light and dark palettes and the contrast report from chosen colours (nothing saved)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThemeRoles" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [palette, dark, report]
                properties:
                  palette: { $ref: "#/components/schemas/Palette" }
                  dark: { $ref: "#/components/schemas/Palette" }
                  report: { $ref: "#/components/schemas/ContrastReport" }
  /admin/branding/import:
    post:
      tags: [admin]
      operationId: importColorHunt
      summary: "Read the four colours of a Color Hunt palette link and suggest roles (the link itself carries the colours; nothing is fetched)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [url], properties: { url: { type: string } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [colours, roles]
                properties:
                  colours: { type: array, items: { $ref: "#/components/schemas/HexColour" } }
                  roles: { type: object, additionalProperties: { $ref: "#/components/schemas/HexColour" } }
        "400": { $ref: "#/components/responses/Error" }
  /admin/branding/assets/upload-url:
    post:
      tags: [admin]
      operationId: brandAssetUploadUrl
      summary: "A ticket to upload a logo or icon (PNG, WebP or JPEG, at most 2 MB); attach the key to a draft"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [content_type], properties: { content_type: { type: string, enum: [image/png, image/webp, image/jpeg] } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [key, upload_url, expires_at]
                properties:
                  key: { type: string }
                  upload_url: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
  /admin/branding/themes:
    post:
      tags: [admin]
      operationId: createThemeDraft
      summary: "Save a new draft theme version"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThemeDraftInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThemeVersion" }
        "400": { $ref: "#/components/responses/Error" }
  /admin/branding/themes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [admin]
      operationId: getThemeVersion
      summary: "One theme version"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThemeVersion" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [admin]
      operationId: updateThemeDraft
      summary: "Replace a draft (published and archived versions never change)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThemeDraftInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThemeVersion" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      operationId: deleteThemeDraft
      summary: "Delete a draft that was never published"
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Error" }
  /admin/branding/themes/{id}/publish:
    post:
      tags: [admin]
      operationId: publishTheme
      summary: "Make a draft live, or roll back to an archived version (contrast must pass; reason required; audited)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonInput" }
      responses:
        "202": { $ref: "#/components/responses/SentForApproval" }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThemeVersion" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/riders/{id}:
    get:
      tags: [admin]
      operationId: getAdminRider
      summary: "One rider for staff: account, sessions, trip figures, places and routes, ratings and complaints, SOS, dues, notes"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRider" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/riders/{id}/sessions/end:
    post:
      tags: [admin]
      operationId: endRiderSessions
      summary: "Sign a rider out of one session (session_id) or all of them (riders.block; audited)"
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EndSessionsInput" }
      responses:
        "204": { description: Ended }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/drivers/{id}/activity:
    get:
      tags: [admin]
      operationId: getAdminDriverActivity
      summary: "A driver's activity for staff: trips, offer answers, places, ratings, complaints, SOS, money, sessions, notes"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDriverActivity" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/riders/{id}/charts:
    get:
      tags: [admin]
      operationId: getAdminRiderCharts
      summary: "Series for the Charts tab: trips and fares per day, by hour, by vehicle type"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365 }, description: "Window in days (default 90)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonCharts" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/drivers/{id}/charts:
    get:
      tags: [admin]
      operationId: getAdminDriverCharts
      summary: "Series for the Charts tab: trips and fares per day, by hour, by vehicle type, offer answers per day"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365 }, description: "Window in days (default 90)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonCharts" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/drivers/{id}/sessions/end:
    post:
      tags: [admin]
      operationId: endDriverSessions
      summary: "Sign a driver out of one session (session_id) or all of them (drivers.review; audited)"
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EndSessionsInput" }
      responses:
        "204": { description: Ended }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/people/{id}/notes:
    post:
      tags: [admin]
      operationId: addPersonNote
      summary: "Add a staff note to a rider or driver (audited)"
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonNote" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/riders/{id}/block:
    post:
      tags: [admin]
      operationId: blockRider
      summary: "Block an account (ends its sessions; audited)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonInput" }
      responses:
        "204":
          description: OK
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/riders/{id}/unblock:
    post:
      tags: [admin]
      operationId: unblockRider
      summary: "Unblock an account (audited)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonInput" }
      responses:
        "204":
          description: OK
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/pricing:
    get:
      tags: [admin]
      operationId: getAdminPricing
      summary: "Tariffs, fee policy with history, fixed fares, pricing engines"
      parameters:
        - { name: country, in: query, schema: { type: string }, description: "Scope: country code (default the brand's home country)" }
        - { name: area_id, in: query, schema: { type: string, format: uuid }, description: "Scope: one area of the country" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingAdmin" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/pricing/tariffs/{service}/{class}:
    put:
      tags: [admin]
      operationId: updateTariff
      summary: "Change one ride type's prices (audited)"
      parameters:
        - { name: country, in: query, schema: { type: string } }
        - { name: area_id, in: query, schema: { type: string, format: uuid } }
        - { name: service, in: path, required: true, schema: { type: string } }
        - { name: class, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TariffInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingAdmin" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      operationId: deleteTariffOverride
      summary: "Remove a region's own price so it uses the country price again (Operations; audited)"
      parameters:
        - { name: service, in: path, required: true, schema: { type: string } }
        - { name: class, in: path, required: true, schema: { type: string } }
        - { name: country, in: query, schema: { type: string } }
        - { name: area_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: reason, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error", description: "COUNTRY_DEFAULT_REQUIRED" }
  /admin/geofences:
    get:
      tags: [admin]
      operationId: listGeofences
      summary: "A country's districts, zones and places, with the profile applied to each"
      parameters:
        - { name: country, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [DISTRICT, ZONE, PLACE] } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, INACTIVE, ARCHIVED] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Geofence" } } } }
    post:
      tags: [admin]
      operationId: createGeofence
      summary: "Draw a district or zone (GeoJSON Polygon/MultiPolygon, lng-lat) or place a point with a radius (areas.edit; audited)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/GeofenceShape"
                - type: object
                  required: [country, kind, code, name, reason]
                  properties:
                    country: { type: string }
                    kind: { type: string, enum: [DISTRICT, ZONE, PLACE] }
                    code: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,47}$" }
                    name: { type: string, minLength: 1, maxLength: 80 }
                    reason: { type: string, minLength: 1 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Geofence" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/geofences/overlaps:
    get:
      tags: [admin]
      operationId: geofenceOverlaps
      summary: "Active geofences of a country whose shapes meet"
      parameters:
        - { name: country, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [a, b, kind]
                      properties:
                        a: { $ref: "#/components/schemas/GeofenceHit" }
                        b: { $ref: "#/components/schemas/GeofenceHit" }
                        kind: { type: string, enum: [SAME_KIND, NESTED] }
  /admin/geofences/import:
    post:
      tags: [admin]
      operationId: importGeofences
      summary: "Import a GeoJSON FeatureCollection (properties.name, properties.code; radius_m for places): dry run per feature, then all or nothing"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country, kind, features]
              properties:
                country: { type: string }
                kind: { type: string, enum: [DISTRICT, ZONE, PLACE] }
                features: { type: object, additionalProperties: true }
                dry_run: { type: boolean }
                reason: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [code, outcome]
                      properties:
                        code: { type: string }
                        outcome: { type: string, enum: [CREATE, UPDATE, INVALID] }
                        error: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /admin/geofences/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [admin]
      operationId: getGeofence
      summary: "One geofence with its shape versions"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Geofence" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      operationId: updateGeofence
      summary: "Rename, switch off or archive (not while a profile is applied)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                name: { type: string }
                status: { type: string, enum: [ACTIVE, INACTIVE, ARCHIVED] }
                reason: { type: string, minLength: 1 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Geofence" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /admin/geofences/{id}/geometry:
    put:
      tags: [admin]
      operationId: reshapeGeofence
      summary: "Save a new shape (the next version; records keep the version they matched)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/GeofenceShape"
                - type: object
                  required: [reason]
                  properties:
                    reason: { type: string, minLength: 1 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Geofence" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/pricing/profiles:
    get:
      tags: [admin]
      operationId: listPricingProfiles
      summary: "A country's pricing profiles: the default first, then by name"
      parameters:
        - { name: country, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/PricingProfile" } } } }
    post:
      tags: [admin]
      operationId: createPricingProfile
      summary: "A new DRAFT profile (fees.edit; audited)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country, name, reason]
              properties:
                country: { type: string }
                name: { type: string, minLength: 1, maxLength: 80 }
                description: { type: string, maxLength: 500 }
                reason: { type: string, minLength: 1 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PricingProfile" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /admin/pricing/profiles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [admin]
      operationId: getPricingProfile
      summary: "One profile with its versions, assignments (open and closed) and history"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PricingProfile" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      operationId: updatePricingProfile
      summary: "Rename, describe, or set/clear the activation window (never on the default)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                name: { type: string }
                description: { type: string }
                active_from: { type: string, format: date-time }
                active_until: { type: string, format: date-time }
                clear_window: { type: boolean }
                reason: { type: string, minLength: 1 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PricingProfile" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/pricing/profiles/{id}/versions:
    post:
      tags: [admin]
      operationId: publishPricingProfileVersion
      summary: "Publish the next immutable version: rules and extra charges, now or later (fees.edit; audited)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terms, reason]
              properties:
                terms: { $ref: "#/components/schemas/ProfileTerms" }
                charges: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/ChargeRule" } }
                effective_from: { type: string, format: date-time }
                reason: { type: string, minLength: 1 }
      responses:
        "202": { $ref: "#/components/responses/SentForApproval" }
        "201": { description: Published, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileVersion" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/pricing/profiles/{id}/status:
    post:
      tags: [admin]
      operationId: setPricingProfileStatus
      summary: "Switch a profile on or off (the default is always on); trips already priced keep their record"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status, reason], properties: { status: { type: string, enum: [ACTIVE, INACTIVE] }, reason: { type: string, minLength: 1 } } }
      responses:
        "202": { $ref: "#/components/responses/SentForApproval" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PricingProfile" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /admin/pricing/profiles/{id}/assignments:
    post:
      tags: [admin]
      operationId: assignPricingProfile
      summary: "Apply a profile to a region (one profile per place; close the other one first)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope_kind, scope_id, reason]
              properties:
                scope_kind: { type: string, enum: [AREA, DISTRICT, ZONE, PLACE] }
                scope_id: { type: string }
                priority: { type: integer, minimum: -1000, maximum: 1000 }
                reason: { type: string, minLength: 1 }
      responses:
        "202": { $ref: "#/components/responses/SentForApproval" }
        "201": { description: Assigned, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileScope" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/pricing/profiles/{id}/assignments/{assignmentId}:
    delete:
      tags: [admin]
      operationId: unassignPricingProfile
      summary: "End an assignment (kept in history; the country default is only replaced)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: reason, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Ended }
        "409": { $ref: "#/components/responses/Error" }
  /admin/pricing/profiles/{id}/make-default:
    post:
      tags: [admin]
      operationId: makePricingProfileDefault
      summary: "Make an active, complete profile its country's default (the old default's assignment ends in the same step)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonInput" }
      responses:
        "202": { $ref: "#/components/responses/SentForApproval" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PricingProfile" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /admin/pricing/payees:
    get:
      tags: [admin]
      operationId: listChargePayees
      summary: "Third parties extra charges are owed to"
      parameters:
        - { name: country, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/ChargePayee" } } } }
    post:
      tags: [admin]
      operationId: createChargePayee
      summary: "Add a payee (fees.edit; audited)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country, name, kind, reason]
              properties:
                country: { type: string }
                name: { type: string, minLength: 1, maxLength: 80 }
                kind: { type: string, enum: [TAX_AUTHORITY, REGULATOR, AIRPORT, MUNICIPALITY, PARKING_OPERATOR, OTHER] }
                reference: { type: string }
                reason: { type: string, minLength: 1 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ChargePayee" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /admin/pricing/payees/{id}:
    patch:
      tags: [admin]
      operationId: updateChargePayee
      summary: "Rename a payee or switch it off (not while an active profile charges for it)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                name: { type: string }
                reference: { type: string }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
                reason: { type: string, minLength: 1 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChargePayee" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /admin/trips/{id}/pricing-record:
    get:
      tags: [admin]
      operationId: getTripPricingRecord
      summary: "The trip's immutable pricing record: profile, version, where it applied, why it won, charges and the final split"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          headers:
            ETag: { schema: { type: string }, description: "The record hash once final" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRecord" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /legal/consent:
    get:
      tags: [public]
      security: []
      operationId: getConsentDocument
      summary: "The current privacy notice for an app, in the caller's language (ETag)"
      parameters:
        - { name: app, in: query, required: true, schema: { type: string, enum: [rider, driver, RIDER, DRIVER] } }
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentDocument" }
        "304": { description: Not modified }
        "404": { $ref: "#/components/responses/Error" }
  /me/consents:
    post:
      tags: [me]
      operationId: acceptConsent
      summary: "Accept the app's current privacy notice (recorded with time, install and address)"
      parameters:
        - $ref: "#/components/parameters/InstallId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app, version]
              properties:
                app: { type: string, enum: [RIDER, DRIVER] }
                version: { type: integer }
      responses:
        "204": { description: Accepted }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: "CONSENT_VERSION_STALE with details.current_version", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /me/privacy-requests:
    get:
      tags: [me]
      operationId: listMyPrivacyRequests
      summary: "My data export and deletion requests, newest first"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/PrivacyRequest" } } } }
    post:
      tags: [me]
      operationId: createPrivacyRequest
      summary: "Ask for a copy of my data, or for my account to be deleted (one open per kind, three a day)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [kind], properties: { kind: { type: string, enum: [EXPORT, DELETE] } } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyRequest" }
        "409": { description: "PRIVACY_REQUEST_OPEN with details.request_id", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/Error" }
  /me/privacy-requests/{id}/cancel:
    post:
      tags: [me]
      operationId: cancelPrivacyRequest
      summary: "Withdraw a request staff have not picked up yet"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyRequest" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/privacy-requests/{id}/download:
    get:
      tags: [me]
      operationId: downloadPrivacyExport
      summary: "A 15-minute link to my ready export (the export itself is kept 24 h)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [url, expires_at], properties: { url: { type: string }, expires_at: { type: string, format: date-time } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /admin/privacy/requests:
    get:
      tags: [admin]
      operationId: listPrivacyRequests
      summary: "Privacy requests: open ones first by due date (privacy.handle)"
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [REQUESTED, IN_PROGRESS, READY, DONE, REJECTED, CANCELLED] } }
        - { name: kind, in: query, schema: { type: string, enum: [EXPORT, DELETE] } }
        - { name: country, in: query, schema: { type: string }, description: "Staff limited to countries always see only theirs" }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/PrivacyRequest" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /admin/privacy/requests/{id}:
    get:
      tags: [admin]
      operationId: getPrivacyRequest
      summary: "One request; an open deletion lists what would block it now"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyRequest" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/privacy/requests/{id}/approve:
    post:
      tags: [admin]
      operationId: approvePrivacyRequest
      summary: "Export: build the file (READY within minutes). Delete: anonymise now, or 409 DELETE_BLOCKED with details.blockers"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonInput" }
      responses:
        "202": { $ref: "#/components/responses/SentForApproval" }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/privacy/requests/{id}/reject:
    post:
      tags: [admin]
      operationId: rejectPrivacyRequest
      summary: "Close a request with the reason the person sees"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/privacy/retention:
    get:
      tags: [admin]
      operationId: getRetention
      summary: "Retention rules, their periods and last daily run"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [name, days, rows_last_run]
                      properties:
                        name: { type: string }
                        days: { type: integer }
                        last_run_at: { type: [string, "null"], format: date-time }
                        rows_last_run: { type: integer }
                        error: { type: [string, "null"] }
        "403": { $ref: "#/components/responses/Error" }
  /admin/fraud/flags:
    get:
      tags: [admin]
      operationId: listFraudFlags
      summary: "The fraud review queue, newest first (cursor = opened_at of the last row)"
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [OPEN, DISMISSED, CONFIRMED] } }
        - { name: rule, in: query, schema: { type: string, enum: [GPS_SPOOF, SELF_BOOKING, DRIVER_CANCEL_RATE, DRIVER_NO_SHOW_RATE, RIDER_CANCEL_RATE] } }
        - { name: subject_kind, in: query, schema: { type: string, enum: [DRIVER, RIDER] } }
        - { name: subject_id, in: query, schema: { type: string, format: uuid } }
        - { name: country, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/FraudFlag" } }
                  next_cursor: { type: string, description: "Empty at the end" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/fraud/flags/{id}:
    get:
      tags: [admin]
      operationId: getFraudFlag
      summary: "One fraud flag with its evidence"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FraudFlag" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/fraud/flags/{id}/review:
    post:
      tags: [admin]
      operationId: reviewFraudFlag
      summary: "Dismiss or confirm a flag with a note (fraud.review, audited); a reviewed flag never changes"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, note]
              properties:
                decision: { type: string, enum: [DISMISS, CONFIRM] }
                note: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FraudFlag" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/pricing/as-of:
    get:
      tags: [admin]
      operationId: getPricingAsOf
      summary: "Which profile priced a point (and a drop-off) at a past time, rebuilt from the assignment and profile history"
      parameters:
        - { name: country, in: query, schema: { type: string } }
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
        - { name: at, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: dropoff_lat, in: query, schema: { type: number } }
        - { name: dropoff_lng, in: query, schema: { type: number } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingAsOf" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/pricing/history:
    get:
      tags: [admin]
      operationId: getPricingHistory
      summary: "Which profile was assigned where, from when to when, who changed it and why (range up to 366 days)"
      parameters:
        - { name: country, in: query, schema: { type: string } }
        - { name: scope_kind, in: query, schema: { type: string, enum: [COUNTRY, AREA, DISTRICT, ZONE, PLACE] } }
        - { name: scope_id, in: query, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingTimeline" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/pricing/records.csv:
    get:
      tags: [admin]
      operationId: exportPricingRecords
      summary: "Finalised trip pricing records of a country as CSV (range up to 31 days; finance.view and country-level access)"
      parameters:
        - { name: country, in: query, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/pricing/simulate:
    post:
      tags: [admin]
      operationId: simulatePricing
      summary: "Price a trip like a quote without saving anything, optionally at another time (±7 days) or with a draft profile taking part"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulateInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingSimulation" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/pricing/policy:
    post:
      tags: [admin]
      operationId: publishFeePolicy
      summary: "Publish the next fee-policy version (audited)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingAdmin" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/pricing/fixed-routes:
    post:
      tags: [admin]
      operationId: saveFixedRoute
      summary: "Create or update a fixed fare (audited)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FixedRouteInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingAdmin" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/pricing/fixed-routes/{id}:
    delete:
      tags: [admin]
      operationId: deleteFixedRoute
      summary: "Retire a fixed fare (audited)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: reason, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingAdmin" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/finance:
    get:
      tags: [admin]
      operationId: getAdminFinance
      summary: "Ledger totals and driver balances in one country's currency"
      parameters:
        - { name: country, in: query, schema: { type: string }, description: "Country whose currency is reported (default the brand's home country)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFinance" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/finance/journal:
    get:
      tags: [admin]
      operationId: listJournal
      summary: "Recent ledger transactions with their legs"
      parameters:
        - { name: country, in: query, schema: { type: string }, description: "Country whose currency is reported (default the brand's home country)" }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/JournalEntry" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /admin/finance/verify:
    post:
      tags: [admin]
      operationId: verifyLedgerChain
      summary: "Recompute the ledger hash chain"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [ok, checked], properties: { ok: { type: boolean }, checked: { type: integer }, broken_at: { type: string } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/countries:
    get:
      tags: [admin]
      operationId: listCountries
      summary: "Countries the brand operates in (from the brand file), with area counts"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Country" } } } }
  /admin/areas:
    get:
      tags: [admin]
      operationId: listAreas
      summary: "Operating areas of a country (regions, counties, states) with their cells"
      parameters: [{ name: country, in: query, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Area" } } } }
        "400": { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      operationId: createArea
      summary: "Create an area as a draft (Operations; audited)"
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AreaInput" } } } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Area" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/areas/{id}:
    get:
      tags: [admin]
      operationId: getArea
      summary: "One area with its cells"
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Area" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      operationId: updateArea
      summary: "Rename, change status or surge rules of an area (Operations; audited)"
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AreaUpdate" } } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Area" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error", description: "COUNTRY_NOT_ACTIVE, AREA_NOT_READY {missing}, AREA_HAS_DRIVERS, AREA_HAS_ACTIVE_TRIPS" }
  /admin/areas/{id}/cells:
    put:
      tags: [admin]
      operationId: saveAreaCells
      summary: "Replace the cells that make up an area (Operations; audited)"
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cells, reason]
              properties:
                cells: { type: array, items: { type: string }, maxItems: 50000, description: "H3 cell ids, any resolution up to 7 (compacted allowed)" }
                reason: { type: string, minLength: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Area" }
        "400": { $ref: "#/components/responses/Error", description: "AREA_CELL_INVALID, AREA_CELL_RESOLUTION, AREA_TOO_LARGE" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error", description: "AREA_CELLS_OVERLAP {cells, areas}, AREA_ARCHIVED" }
  /admin/drivers/{id}/areas:
    put:
      tags: [admin]
      operationId: setDriverAreas
      summary: "Set the areas a driver works in (Operations, Driver Review; audited)"
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [area_ids, reason]
              properties:
                area_ids: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 5 }
                primary_area_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [areas], properties: { areas: { type: array, items: { $ref: "#/components/schemas/AreaRef" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/roles:
    get:
      tags: [admin]
      operationId: listRoles
      summary: "Staff roles with their permissions, and the permission catalogue (staff.manage)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, permissions]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Role" } }
                  permissions: { type: array, items: { $ref: "#/components/schemas/Permission" } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      operationId: createRole
      summary: "Create a role from permissions (staff.manage; audited)"
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RoleInput" } } } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/roles/{id}:
    put:
      tags: [admin]
      operationId: updateRole
      summary: "Rename a role or change its permissions (staff.manage; audited)"
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RoleInput" } } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error", description: "ROLE_LOCKED, ROLE_NAME_TAKEN" }
    delete:
      tags: [admin]
      operationId: deleteRole
      summary: "Delete a role nobody holds (staff.manage; audited)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: reason, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error", description: "ROLE_LOCKED, ROLE_IN_USE" }
  /admin/staff/{id}:
    get:
      tags: [admin]
      operationId: getStaff
      summary: "One staff member: roles, permissions, access limits and sign-in sessions"
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/staff/{id}/sessions/end:
    post:
      tags: [admin]
      operationId: endStaffSessions
      summary: "End one session (session_id) or all open sessions (staff.manage; audited); takes effect on the next request"
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                session_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1 }
      responses:
        "204": { description: Ended }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/staff/{id}/deactivate:
    post:
      tags: [admin]
      operationId: deactivateStaff
      summary: "Deactivate an account and end its sessions (staff.manage; audited)"
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReasonInput" } } } }
      responses:
        "204": { description: Deactivated }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error", description: "CANNOT_CHANGE_YOURSELF" }
  /admin/staff/{id}/reactivate:
    post:
      tags: [admin]
      operationId: reactivateStaff
      summary: "Reactivate an account (staff.manage; audited)"
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReasonInput" } } } }
      responses:
        "204": { description: Reactivated }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/staff/{id}/access:
    put:
      tags: [admin]
      operationId: setStaffAccess
      summary: "Limit a person to countries or regions; empty = everywhere (staff.manage; audited)"
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access, reason]
              properties:
                access: { type: array, items: { $ref: "#/components/schemas/StaffAccess" } }
                reason: { type: string, minLength: 1 }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/finance/holds:
    get:
      tags: [admin]
      operationId: listHolds
      summary: "Drivers who cannot go online: debt holds and staff holds"
      parameters:
        - { name: country, in: query, schema: { type: string }, description: "Scope: country code (default the brand's home country)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/ActiveHold" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /driver/payouts:
    post:
      tags: [driver]
      operationId: createPayout
      summary: Cash out to the account phone
      description: |
        Waits for Finance (REQUESTED) unless the fee policy approves automatically (PENDING).
        Errors: PAYOUTS_UNAVAILABLE (503), IDEMPOTENCY_KEY_REQUIRED, PAYOUT_BELOW_MINIMUM, PAYOUT_ABOVE_BALANCE (400),
        NOTHING_TO_PAY_OUT, PAYOUT_IN_PROGRESS, PAYOUT_BLOCKED_BY_HOLD (409), PAYOUT_RATE_LIMITED (429).
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: "#/components/schemas/Money" }
      responses:
        "201":
          description: Requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "200":
          description: Replayed (same Idempotency-Key)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    get:
      tags: [driver]
      operationId: listPayouts
      summary: The driver's recent payouts
      responses:
        "200":
          description: Payouts, newest first
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Payout" } } } }
  /driver/payouts/{id}:
    get:
      tags: [driver]
      operationId: getPayout
      summary: One of the driver's payouts
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The payout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "404": { $ref: "#/components/responses/Error" }
  /driver/payouts/{id}/cancel:
    post:
      tags: [driver]
      operationId: cancelPayout
      summary: Withdraw a request Finance has not acted on (PAYOUT_NOT_ACTIONABLE otherwise)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/finance/payouts:
    get:
      tags: [admin]
      operationId: listAdminPayouts
      summary: Driver cash-outs in the selected country's currency, open ones first
      parameters:
        - { name: country, in: query, schema: { type: string }, description: "Country whose currency is listed (default the brand's home country)" }
        - { name: status, in: query, schema: { type: string, enum: [REQUESTED, PENDING, PAID, FAILED, REJECTED, CANCELLED] } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
      responses:
        "200":
          description: Payouts
          content:
            application/json:
              schema:
                type: object
                required: [data, enabled]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AdminPayout" } }
                  enabled: { type: boolean, description: "False when no payout gateway is configured" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/finance/payouts/{id}/approve:
    post:
      tags: [admin]
      operationId: approvePayout
      summary: Send a requested payout (payouts.approve; the balance is checked again; audited)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReasonInput" } } } }
      responses:
        "202": { $ref: "#/components/responses/SentForApproval" }
        "200":
          description: Approved (PENDING)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/finance/payouts/{id}/reject:
    post:
      tags: [admin]
      operationId: rejectPayout
      summary: Refuse a requested payout with a reason (payouts.approve; audited)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReasonInput" } } } }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/compliance/regulator:
    get:
      tags: [admin]
      operationId: listRegulatorStatus
      summary: Each regulated country's regulator, adapter, switches and figures (compliance.manage)
      parameters:
        - { name: country, in: query, schema: { type: string } }
      responses:
        "200":
          description: Statuses
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/RegulatorStatus" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /admin/compliance/regulator/{country}:
    patch:
      tags: [admin]
      operationId: setRegulatorSettings
      summary: Turn sending and fail-closed on or off for a country (audited; REGULATOR_NONE, REGULATOR_NOT_CONFIGURED)
      parameters:
        - { name: country, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                enabled: { type: boolean }
                fail_closed: { type: boolean }
                reason: { type: string, minLength: 1 }
      responses:
        "202": { $ref: "#/components/responses/SentForApproval" }
        "200":
          description: The country's switches
          content:
            application/json:
              schema: { type: object, required: [enabled, fail_closed], properties: { enabled: { type: boolean }, fail_closed: { type: boolean } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/compliance/submissions:
    get:
      tags: [admin]
      operationId: listRegulatorSubmissions
      summary: The regulator outbox, newest first
      parameters:
        - { name: country, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [DRIVER, VEHICLE, TRIP, DAILY_REPORT] } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, ACCEPTED, SKIPPED] } }
        - { name: stuck, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string }, description: "Trip code, plate, driver name or subject key" }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/RegulatorSubmission" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /admin/compliance/submissions/{id}/retry:
    post:
      tags: [admin]
      operationId: retryRegulatorSubmission
      summary: Make a pending submission due now (audited; SUBMISSION_NOT_PENDING)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReasonInput" } } } }
      responses:
        "200":
          description: The submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegulatorSubmission" }
        "409": { $ref: "#/components/responses/Error" }
  /driver/documents:
    get:
      tags: [driver]
      operationId: getDriverDocuments
      summary: The driver's documents with expiry states and any renewal waiting for review
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverDocuments" }
  /driver/documents/renewals:
    post:
      tags: [driver]
      operationId: renewDocument
      summary: Upload a renewed document (approved drivers); it waits for review beside the current one
      description: Upload the file first with POST /driver/onboarding/uploads. Errors UNKNOWN_DOCUMENT_KIND, UPLOAD_MISSING, DRIVER_NOT_APPROVED, expires_on field errors.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DocumentInput" } } } }
      responses:
        "201":
          description: Documents after the upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverDocuments" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/compliance/document-types:
    get:
      tags: [admin]
      operationId: listDocumentTypes
      summary: The documents a country asks drivers for (compliance.manage)
      parameters:
        - { name: country, in: query, schema: { type: string } }
      responses:
        "200":
          description: Types in display order
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/DocumentType" } } } }
    put:
      tags: [admin]
      operationId: saveDocumentType
      summary: Create or change one of a country's document types (mandatory, optional or off; expiry rules). Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/DocumentType"
                - type: object
                  required: [reason]
                  properties: { reason: { type: string, minLength: 1 } }
      responses:
        "200":
          description: The country's types after the change
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/DocumentType" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/compliance/documents:
    get:
      tags: [admin]
      operationId: listAdminDocuments
      summary: Approved drivers' documents in a country by state
      parameters:
        - { name: country, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, enum: [EXPIRING, EXPIRED, UNKNOWN, RENEWAL_PENDING, MISSING] } }
      responses:
        "200":
          description: Rows
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/AdminDocument" } } } }
  /admin/drivers/{id}/documents/{docId}/expiry:
    patch:
      tags: [admin]
      operationId: setDocumentExpiry
      summary: Correct a document's expiry date (drivers.review; audited; holds re-evaluated)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: docId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expires_on, reason]
              properties:
                expires_on: { type: string, format: date }
                reason: { type: string, minLength: 1 }
      responses:
        "200":
          description: The driver
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/Error" }
  /admin/finance/payins:
    get:
      tags: [admin]
      operationId: listPayins
      summary: "Recent mobile-money payments: driver debt pay-ins and rider fares"
      parameters:
        - { name: purpose, in: query, schema: { type: string, enum: [DRIVER_DEBT, RIDE_FARE] } }
        - { name: country, in: query, schema: { type: string }, description: "Country whose currency is reported (default the brand's home country)" }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, COLLECTED, FAILED] } }
        - { name: driver_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/AdminPayin" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /admin/drivers/{id}/hold:
    post:
      tags: [admin]
      operationId: placeHold
      summary: "Put a driver on hold (staff; audited)"
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReasonInput" } } } }
      responses:
        "200":
          description: The hold
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hold" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/drivers/{id}/hold/release:
    post:
      tags: [admin]
      operationId: releaseHold
      summary: "Release a staff hold (a debt hold lifts only when paid; audited)"
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReasonInput" } } } }
      responses:
        "200":
          description: Holds still active
          content:
            application/json:
              schema: { type: object, required: [holds], properties: { holds: { type: array, items: { $ref: "#/components/schemas/Hold" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/staff:
    get:
      tags: [admin]
      operationId: listStaff
      summary: "Dashboard accounts and the roles that can be granted"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffList" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      tags: [admin]
      operationId: setStaff
      summary: "Grant dashboard access with roles (empty roles removes access; audited)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffInput" }
      responses:
        "202": { $ref: "#/components/responses/SentForApproval" }
        "200":
          description: Staff list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffList" }
        "400": { $ref: "#/components/responses/Error" }
  /admin/drivers:
    get:
      tags: [admin]
      operationId: listDrivers
      summary: Drivers, pending reviews first
      parameters:
        - { name: country, in: query, schema: { type: string }, description: "Scope: country code (default the brand's home country)" }
        - { name: area_id, in: query, schema: { type: string }, description: "Scope: one area of the country" }
        - { name: status, in: query, schema: { type: string, enum: [ONBOARDING, PENDING_REVIEW, APPROVED, REJECTED, SUSPENDED] } }
        - { name: q, in: query, schema: { type: string }, description: "Name, phone or plate" }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverPage" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/drivers/{id}:
    get:
      tags: [admin]
      operationId: getDriver
      summary: A driver's application with document links and decision history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/drivers/{id}/approve:
    post:
      tags: [admin]
      operationId: approveDriver
      summary: Approve driver, vehicle and pending documents
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/drivers/{id}/reject:
    post:
      tags: [admin]
      operationId: rejectDriver
      summary: Send the application back with a reason
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/drivers/{id}/suspend:
    post:
      tags: [admin]
      operationId: suspendDriver
      summary: Stop a driver working (takes them offline)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/drivers/{id}/reinstate:
    post:
      tags: [admin]
      operationId: reinstateDriver
      summary: Lift a suspension
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/drivers/{id}/documents/{docId}/review:
    post:
      tags: [admin]
      operationId: reviewDocument
      summary: Approve or reject one document
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: docId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [approve], properties: { approve: { type: boolean }, reason: { type: string } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/audit:
    get:
      tags: [admin]
      operationId: listAudit
      summary: Recent staff decisions
      parameters:
        - { name: target, in: query, schema: { type: string }, description: "e.g. driver:<uuid>" }
        - { name: action, in: query, schema: { type: string }, description: "Action prefix, e.g. staff.login (sign-ins and failed sign-ins)" }
        - { name: actor, in: query, schema: { type: string, format: uuid }, description: "Only what this person did" }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /driver/status:
    get:
      tags: [driver]
      operationId: getDriverStatus
      summary: Whether this driver is online, with the live presence record
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverStatus" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      tags: [driver]
      operationId: setDriverStatus
      summary: Go online (with position and capabilities) or offline
      description: |
        Online means a presence record whose last ping is within the staleness
        window (120 s). Keep it fresh with the location stream; silence makes the
        driver invisible to riders without any explicit offline call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverStatusInput" }
      responses:
        "200":
          description: New status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverStatus" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error", description: "DRIVER_ON_HOLD with details.holds and details.pay_to_unhold" }
        "503": { $ref: "#/components/responses/Error" }
  /driver/location:
    post:
      tags: [driver]
      operationId: postDriverLocation
      summary: One GPS sample (HTTP fallback for the realtime stream)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationSample" }
      responses:
        "200":
          description: Presence after the ping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverStatus" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/places:
    get:
      tags: [rider, driver]
      operationId: listPlaces
      summary: Saved places (home, work, others)
      responses:
        "200":
          description: Places
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Place" } }
    post:
      tags: [rider, driver]
      operationId: savePlace
      summary: Save a place (HOME and WORK replace the existing one)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceInput" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Place" }
        "400": { $ref: "#/components/responses/Error" }
  /me/places/{id}:
    delete:
      tags: [rider, driver]
      operationId: deletePlace
      summary: Remove a saved place
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /admin/approvals/requests:
    get:
      tags: [admin]
      operationId: listApprovalRequests
      summary: "The approvals inbox: pending requests in the caller's countries, the caller's own, or finished ones"
      parameters:
        - { name: box, in: query, schema: { type: string, enum: [pending, mine, done], default: pending } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ApprovalRequest" } }
        "403": { $ref: "#/components/responses/Error" }
  /admin/approvals/requests/summary:
    get:
      tags: [admin]
      operationId: getApprovalSummary
      summary: "The nav badge: pending requests the caller could approve or reject now"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [actionable]
                properties:
                  actionable: { type: integer }
        "403": { $ref: "#/components/responses/Error" }
  /admin/approvals/requests/{id}:
    get:
      tags: [admin]
      operationId: getApprovalRequest
      summary: "One approval request with its readable change, steps and decisions (only inside the caller's countries)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalRequest" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { description: "APPROVAL_NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/approvals/requests/{id}/approve:
    post:
      tags: [admin]
      operationId: approveApprovalRequest
      summary: "Approve the current step (audited). On the last approval the change runs at once as the requester of record; the request comes back EXECUTED or FAILED"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalNoteInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { description: "APPROVAL_SELF (the requester) or APPROVAL_NOT_APPROVER (no listed role, or the step's roles you hold are covered)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "APPROVAL_NOT_PENDING, APPROVAL_EXPIRED or APPROVAL_ALREADY_DECIDED", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/approvals/requests/{id}/reject:
    post:
      tags: [admin]
      operationId: rejectApprovalRequest
      summary: "Reject on the current step with a note (audited); nothing is applied"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalNoteInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalRequest" }
        "400": { description: "APPROVAL_NOTE_REQUIRED", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/approvals/requests/{id}/cancel:
    post:
      tags: [admin]
      operationId: cancelApprovalRequest
      summary: "Withdraw your own pending request (audited)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalNoteInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalRequest" }
        "403": { description: "APPROVAL_NOT_REQUESTER", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/approvals/workflows:
    get:
      tags: [admin]
      operationId: listApprovalWorkflows
      summary: "Every approvable action with its workflow (off until saved enabled), and the roles and permissions steps may name (approvals.manage)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalWorkflowList" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/approvals/workflows/{action}:
    get:
      tags: [admin]
      operationId: getApprovalWorkflow
      summary: "One action's workflow with every saved version (approvals.manage)"
      parameters:
        - { name: action, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalWorkflowDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { description: "APPROVAL_UNKNOWN_ACTION", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    put:
      tags: [admin]
      operationId: saveApprovalWorkflow
      summary: "Save the next version of an action's workflow (approvals.manage, audited). Pending requests keep the version they started under"
      parameters:
        - { name: action, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalWorkflowInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalWorkflowDetail" }
        "400": { description: "REASON_REQUIRED or APPROVAL_WORKFLOW_INVALID (details.problems lists each one)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema: { type: string, example: sw }
    AppVersion:
      name: X-App-Version
      in: header
      schema: { type: string, example: 1.0.0 }
    InstallId:
      name: X-Install-Id
      in: header
      description: "A random UUID v4 the app creates once per install (fraud checks); ignored when malformed"
      schema: { type: string, format: uuid }
  responses:
    SentForApproval:
      description: "Held for approval: the action's approval workflow is on and its conditions match, so the change was NOT applied. The body is the approval request (no error); the change runs when the workflow's steps are approved."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApprovalAccepted" }
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ApprovalAccepted:
      type: object
      description: "The 202 body of a gated endpoint: the change was not applied; it waits for approval. No error envelope."
      required: [approval_request]
      properties:
        approval_request: { $ref: "#/components/schemas/ApprovalRequest" }
    ApprovalNoteInput:
      type: object
      properties:
        note: { type: string, maxLength: 1000, description: "Required to reject" }
    ApprovalPerson:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ApprovalChange:
      type: object
      required: [field, before, after]
      properties:
        field: { type: string }
        before: { type: string }
        after: { type: string }
    ApprovalSummary:
      type: object
      required: [title, changes]
      properties:
        title: { type: string }
        changes: { type: array, items: { $ref: "#/components/schemas/ApprovalChange" } }
    ApprovalDecision:
      type: object
      required: [step, approver, decision, as_role, note, at]
      properties:
        step: { type: integer, description: "0-based step index" }
        approver: { $ref: "#/components/schemas/ApprovalPerson" }
        decision: { type: string, enum: [APPROVE, REJECT] }
        as_role: { type: string, description: "The role (or perm:<key>) the approval counted as" }
        note: { type: string }
        at: { type: string, format: date-time }
    ApprovalConditions:
      type: object
      properties:
        amount_min: { $ref: "#/components/schemas/Money" }
        amount_max: { $ref: "#/components/schemas/Money" }
        countries: { type: array, items: { type: string } }
    ApprovalStep:
      type: object
      required: [name, mode, roles, approvals]
      properties:
        name: { type: string, maxLength: 80 }
        mode: { type: string, enum: [ANY, ALL], description: "ANY: `approvals` people holding any listed role (or the permission). ALL: one distinct person per listed role (and the permission)" }
        roles: { type: array, items: { type: string } }
        permission: { type: string }
        approvals: { type: integer, minimum: 1, maximum: 10 }
    ApprovalDefinition:
      type: object
      required: [conditions, steps, expire_hours]
      properties:
        conditions: { $ref: "#/components/schemas/ApprovalConditions" }
        steps: { type: array, items: { $ref: "#/components/schemas/ApprovalStep" } }
        expire_hours: { type: integer, minimum: 1, maximum: 720 }
    ApprovalRequest:
      type: object
      required: [id, action, action_label, status, requester, reason, country, amount, target, summary, payload, workflow,
        workflow_version, current_step, decisions, can_decide, expires_at, created_at, decided_at, executed_at, error]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        action_label: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, EXECUTING, EXECUTED, FAILED, REJECTED, EXPIRED, CANCELLED] }
        requester: { $ref: "#/components/schemas/ApprovalPerson" }
        reason: { type: string }
        country: { type: [string, "null"] }
        amount: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        target: { type: string }
        summary: { $ref: "#/components/schemas/ApprovalSummary" }
        payload: { type: object, additionalProperties: true, description: "What the action's executor runs from" }
        workflow: { $ref: "#/components/schemas/ApprovalDefinition" }
        workflow_version: { type: integer }
        current_step: { type: integer }
        decisions: { type: array, items: { $ref: "#/components/schemas/ApprovalDecision" } }
        can_decide: { type: boolean, description: "The caller may approve or reject the current step now" }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        decided_at: { type: [string, "null"], format: date-time }
        executed_at: { type: [string, "null"], format: date-time }
        result: { description: "The executed action's response" }
        error: { type: [string, "null"], description: "Error code when the action FAILED" }
    ApprovalAction:
      type: object
      required: [key, label, description, group, permission, scoped]
      properties:
        key: { type: string }
        label: { type: string }
        description: { type: string }
        group: { type: string }
        permission: { type: string }
        condition: { type: string, enum: [amount], description: "The numeric field conditions may test" }
        scoped: { type: boolean, description: "Tied to a country (a country condition applies)" }
    ApprovalWorkflow:
      type: object
      required: [action, enabled, definition, version, updated_by, updated_at]
      properties:
        action: { type: string }
        enabled: { type: boolean }
        definition: { $ref: "#/components/schemas/ApprovalDefinition" }
        version: { type: integer, description: "0 = never saved" }
        updated_by: { type: [string, "null"] }
        updated_at: { type: [string, "null"], format: date-time }
    ApprovalActionWorkflow:
      type: object
      required: [action, workflow]
      properties:
        action: { $ref: "#/components/schemas/ApprovalAction" }
        workflow: { $ref: "#/components/schemas/ApprovalWorkflow" }
    ApprovalWorkflowVersion:
      type: object
      required: [version, enabled, definition, created_by, by_name, reason, created_at]
      properties:
        version: { type: integer }
        enabled: { type: boolean }
        definition: { $ref: "#/components/schemas/ApprovalDefinition" }
        created_by: { type: [string, "null"] }
        by_name: { type: [string, "null"] }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    ApprovalWorkflowDetail:
      allOf:
        - { $ref: "#/components/schemas/ApprovalActionWorkflow" }
        - type: object
          required: [history]
          properties:
            history: { type: array, items: { $ref: "#/components/schemas/ApprovalWorkflowVersion" } }
    ApprovalWorkflowList:
      type: object
      required: [data, roles, permissions]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/ApprovalActionWorkflow" } }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { $ref: "#/components/schemas/Permission" } }
    ApprovalWorkflowInput:
      type: object
      required: [enabled, definition, reason]
      properties:
        enabled: { type: boolean }
        definition: { $ref: "#/components/schemas/ApprovalDefinition" }
        reason: { type: string, minLength: 1 }
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string, description: Stable machine-readable code }
            message: { type: string, description: Localised by Accept-Language }
            details: { type: object, additionalProperties: true }
            request_id: { type: string }
    AppKind:
      type: string
      enum: [rider, driver, admin]
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: Access token lifetime in seconds }
        consent_required: { type: boolean, description: "Show the privacy notice (GET /legal/consent) and accept it before booking, going online or submitting" }
    AppConfig:
      type: object
      required: [brand, theme, features, min_app_version]
      properties:
        brand: { $ref: "#/components/schemas/Brand" }
        theme: { $ref: "#/components/schemas/Theme" }
        features: { type: object, additionalProperties: { type: boolean } }
        min_app_version: { type: string }
    Brand:
      type: object
      required: [code, name, country, currency, locale]
      properties:
        code: { type: string }
        name: { type: string }
        legal_entity: { type: string }
        country: { type: string }
        currency: { type: string }
        locale: { type: string }
        support_phone: { type: string }
        support_email: { type: string }
        emergency_phone: { type: string, description: "Country emergency number offered in Safety (e.g. 112)" }
    Theme:
      type: object
      required: [version, palette]
      properties:
        version: { type: integer }
        preset: { type: string }
        palette: { $ref: "#/components/schemas/Palette" }
        dark: { $ref: "#/components/schemas/Palette" }
        typography:
          type: object
          properties:
            heading_font: { type: string }
            body_font: { type: string }
        shape:
          type: object
          description: Corner radii in px (radius_sm, radius_md, radius_lg)
          additionalProperties: { type: integer }
        assets:
          type: object
          description: "Slot (logo_full, logo_mark, logo_on_dark, app_icon, splash, favicon) to a path on the API, e.g. /v1/brand/assets/branding/…"
          additionalProperties: { type: string }
    Palette:
      type: object
      required: [primary, secondary, accent, background, surface, text]
      properties:
        primary: { $ref: "#/components/schemas/HexColour" }
        secondary: { $ref: "#/components/schemas/HexColour" }
        accent: { $ref: "#/components/schemas/HexColour" }
        background: { $ref: "#/components/schemas/HexColour" }
        surface: { $ref: "#/components/schemas/HexColour" }
        text: { $ref: "#/components/schemas/HexColour" }
        muted: { $ref: "#/components/schemas/HexColour" }
        border: { $ref: "#/components/schemas/HexColour" }
        success: { $ref: "#/components/schemas/HexColour" }
        warning: { $ref: "#/components/schemas/HexColour" }
        danger: { $ref: "#/components/schemas/HexColour" }
        info: { $ref: "#/components/schemas/HexColour" }
        on_primary: { $ref: "#/components/schemas/HexColour" }
        on_accent: { $ref: "#/components/schemas/HexColour" }
        highlight: { $ref: "#/components/schemas/HexColour", description: Tint for tiles and chips }
    BrandIdentity:
      type: object
      required: [name, legal_entity, support_phone, support_email, emergency_phone]
      properties:
        name: { type: string }
        legal_entity: { type: string }
        support_phone: { type: string }
        support_email: { type: string }
        emergency_phone: { type: string }
        edited_at: { type: [string, "null"], format: date-time, description: "Set once staff edit it; until then it follows the brand file" }
    BrandIdentityInput:
      type: object
      required: [name, reason]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        legal_entity: { type: string }
        support_phone: { type: string }
        support_email: { type: string }
        emergency_phone: { type: string }
        reason: { type: string, minLength: 1 }
    ThemeRoles:
      type: object
      properties:
        light: { type: object, additionalProperties: { $ref: "#/components/schemas/HexColour" }, description: "Chosen colours per role (primary, secondary, accent, background, surface, text, …)" }
        dark: { type: object, additionalProperties: { $ref: "#/components/schemas/HexColour" }, description: "Overrides for dark mode; the rest is derived" }
    ContrastReport:
      type: object
      required: [pass, checks]
      properties:
        pass: { type: boolean }
        checks:
          type: array
          items:
            type: object
            required: [key, value, min, pass]
            properties:
              key: { type: string, description: "TEXT_ON_BACKGROUND, TEXT_ON_SURFACE, ON_PRIMARY, ON_ACCENT, PRIMARY_VS_ACCENT (DARK_ prefix for dark mode)" }
              value: { type: number }
              min: { type: number }
              pass: { type: boolean }
    ThemeDraftInput:
      type: object
      required: [name, source, roles]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        source: { type: string, description: "PRESET:<key>, IMPORTED:<link> or CUSTOM" }
        roles: { $ref: "#/components/schemas/ThemeRoles" }
        typography: { type: object, properties: { heading_font: { type: string }, body_font: { type: string } } }
        shape: { type: object, additionalProperties: { type: integer } }
        assets: { type: object, additionalProperties: { type: string }, description: "Slot to the key from an upload ticket" }
    ThemeVersion:
      type: object
      required: [id, version, status, name, source, roles, palette, typography, shape, assets, asset_urls, report, created_at]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        name: { type: string }
        source: { type: string }
        roles: { $ref: "#/components/schemas/ThemeRoles" }
        palette: { $ref: "#/components/schemas/Palette" }
        dark: { oneOf: [{ $ref: "#/components/schemas/Palette" }, { type: "null" }] }
        typography: { type: object, additionalProperties: { type: string } }
        shape: { type: object, additionalProperties: { type: integer } }
        assets: { type: object, additionalProperties: { type: string } }
        asset_urls: { type: object, additionalProperties: { type: string } }
        report: { $ref: "#/components/schemas/ContrastReport" }
        change_reason: { type: [string, "null"] }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        published_at: { type: [string, "null"], format: date-time }
        published_by: { type: [string, "null"] }
    BrandingOverview:
      type: object
      required: [identity, versions, presets, fonts, asset_slots, shape_max]
      properties:
        identity: { $ref: "#/components/schemas/BrandIdentity" }
        versions: { type: array, items: { $ref: "#/components/schemas/ThemeVersion" } }
        presets: { type: array, items: { $ref: "#/components/schemas/ThemePreset" } }
        fonts: { type: array, items: { type: string } }
        asset_slots: { type: array, items: { type: string } }
        shape_max: { type: object, additionalProperties: { type: integer } }
    HexColour:
      type: string
      pattern: "^#[0-9A-Fa-f]{6}$"
      example: "#0B2447"
    ThemePreset:
      type: object
      required: [key, name, colours, roles]
      properties:
        key: { type: string }
        name: { type: string }
        colours: { type: array, minItems: 4, maxItems: 4, items: { $ref: "#/components/schemas/HexColour" } }
        roles: { type: object, additionalProperties: { $ref: "#/components/schemas/HexColour" } }
        source_url: { type: [string, "null"] }
        tags: { type: array, items: { type: string } }
    Service:
      type: object
      required: [key, category, name, status, vehicle_classes, request_schema, lifecycle]
      properties:
        key: { type: string, example: taxi }
        category: { type: string, enum: [GOODS, PASSENGER, RECOVERY, LIQUID, SERVICE] }
        name: { $ref: "#/components/schemas/LocalizedText" }
        description: { $ref: "#/components/schemas/LocalizedText" }
        status: { type: string, enum: [ACTIVE, HIDDEN, DISABLED] }
        sort_order: { type: integer }
        icon: { type: string, description: MaterialCommunityIcons glyph name }
        vehicle_classes: { type: array, items: { $ref: "#/components/schemas/VehicleClass" } }
        request_schema:
          type: object
          description: JSON Schema (2020-12 subset) with x-ui hints
          additionalProperties: true
        lifecycle:
          type: object
          required: [profile]
          additionalProperties: true
          properties:
            profile: { type: string, enum: [pickup_dropoff] }
            payment_at_end: { type: boolean }
        dispatch: { type: object, additionalProperties: true }
        compliance: { type: object, additionalProperties: true }
    VehicleClass:
      type: object
      required: [key, name, status]
      properties:
        key: { type: string }
        name: { $ref: "#/components/schemas/LocalizedText" }
        description: { $ref: "#/components/schemas/LocalizedText" }
        icon: { type: string }
        sort_order: { type: integer }
        seats: { type: integer }
        regulator_type: { type: string }
        status: { type: string, enum: [ACTIVE, HIDDEN, DISABLED] }
    PlaceResult:
      type: object
      required: [name, location, provider]
      properties:
        name: { type: string }
        address: { type: string }
        location: { $ref: "#/components/schemas/Point" }
        provider: { type: string }
    FeeBreakdown:
      type: object
      description: |
        How the fare is divided (estimate until COMPLETED, then final). Everything is
        inside the total the rider pays: total = driver_earnings + platform_net + vat + levy.
      required: [policy_version, currency, total, booking_fee, ride_fare, commission, vat, levy, levy_borne_by, driver_earnings, platform_net]
      properties:
        policy_version: { type: integer }
        currency: { type: string }
        total: { $ref: "#/components/schemas/Money" }
        booking_fee: { $ref: "#/components/schemas/Money" }
        ride_fare: { $ref: "#/components/schemas/Money" }
        commission: { $ref: "#/components/schemas/Money" }
        vat: { $ref: "#/components/schemas/Money" }
        levy: { $ref: "#/components/schemas/Money" }
        levy_borne_by: { type: string, enum: [PLATFORM, DRIVER, RIDER] }
        driver_earnings: { $ref: "#/components/schemas/Money" }
        platform_net: { $ref: "#/components/schemas/Money" }
    Contact:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, maxLength: 80 }
        phone: { type: string, maxLength: 20 }
    TripContacts:
      type: object
      description: "The passenger (or package sender) at the pickup when it is not the rider, and the package receiver at the drop-off."
      properties:
        pickup: { $ref: "#/components/schemas/Contact" }
        dropoff: { $ref: "#/components/schemas/Contact" }
    RouteStep:
      type: object
      required: [type, distance_m, location]
      properties:
        type: { type: string }
        modifier: { type: string }
        street: { type: string }
        distance_m: { type: integer }
        exit: { type: integer }
        location: { $ref: "#/components/schemas/Point" }
    Message:
      type: object
      required: [id, trip_id, sender_id, sender_role, body, created_at]
      properties:
        id: { type: string, format: uuid }
        trip_id: { type: string, format: uuid }
        sender_id: { type: string, format: uuid }
        sender_role: { type: string, enum: [RIDER, DRIVER] }
        body: { type: string }
        quick_reply: { type: string }
        created_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time }
    MessageInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 500 }
        quick_reply: { type: string, description: "Key of the canned reply used, if any" }
    QuickReply:
      type: object
      required: [key, text]
      properties:
        key: { type: string }
        text: { $ref: "#/components/schemas/LocalizedText" }
    ChatPage:
      type: object
      required: [data, quick_replies]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Message" } }
        quick_replies: { type: array, items: { $ref: "#/components/schemas/QuickReply" } }
    Rating:
      type: object
      required: [trip_id, rater_role, score, aspects, created_at]
      properties:
        trip_id: { type: string, format: uuid }
        rater_role: { type: string, enum: [RIDER, DRIVER] }
        score: { type: integer, minimum: 1, maximum: 5 }
        aspects: { type: array, items: { type: string } }
        comment: { type: string }
        created_at: { type: string, format: date-time }
    RatingInput:
      type: object
      required: [score]
      properties:
        score: { type: integer, minimum: 1, maximum: 5 }
        aspects: { type: array, maxItems: 8, items: { type: string } }
        comment: { type: string, maxLength: 500 }
    RatingSummary:
      type: object
      required: [average, count]
      properties:
        average: { type: number }
        count: { type: integer }
    DeviceInput:
      type: object
      required: [app, platform, push_token]
      properties:
        app: { type: string, enum: [RIDER, DRIVER] }
        platform: { type: string, enum: [ANDROID, IOS, WEB] }
        push_token: { type: string }
        app_version: { type: string }
    DriverProfile:
      type: object
      required: [user_id, phone, status, created_at]
      properties:
        user_id: { type: string, format: uuid }
        full_name: { type: string }
        phone: { type: string }
        status: { type: string, enum: [ONBOARDING, PENDING_REVIEW, APPROVED, REJECTED, SUSPENDED] }
        licence_number: { type: string }
        licence_expiry: { type: string, format: date }
        national_id: { type: string }
        status_reason: { type: string }
        submitted_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        licence_class: { type: string }
        country: { type: string }
    DriverProfileInput:
      type: object
      required: [full_name, licence_number, national_id]
      properties:
        full_name: { type: string }
        licence_number: { type: string, description: "Must match the country's licence_pattern (field error FORMAT)" }
        licence_class: { type: string, description: "One of Onboarding.licence_classes; required when the country lists any (REQUIRED, UNKNOWN)" }
        licence_expiry: { type: string, format: date }
        national_id: { type: string }
        area_id: { type: string, format: uuid, description: "The region the driver will work in (GET /driver/areas); staff can change it after approval" }
    Vehicle:
      type: object
      required: [id, service, vehicle_class, plate, status]
      properties:
        id: { type: string, format: uuid }
        driver_id: { type: string, format: uuid }
        service: { type: string }
        vehicle_class: { type: string }
        plate: { type: string }
        make: { type: string }
        model: { type: string }
        colour: { type: string }
        year: { type: integer }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        status_reason: { type: string }
    VehicleInput:
      type: object
      required: [service, vehicle_class, plate]
      properties:
        service: { type: string }
        vehicle_class: { type: string }
        plate: { type: string }
        make: { type: string }
        model: { type: string }
        colour: { type: string }
        year: { type: integer }
    Document:
      type: object
      required: [id, owner, owner_id, kind, content_type, status, created_at]
      properties:
        id: { type: string, format: uuid }
        owner: { type: string, enum: [DRIVER, VEHICLE] }
        owner_id: { type: string, format: uuid }
        kind: { type: string }
        content_type: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        status_reason: { type: string }
        expires_on: { type: string, format: date }
        created_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time }
        size_bytes: { type: integer, format: int64, description: "Stored file size (absent for files attached before sizes were recorded)" }
        url: { type: string, description: "Short-lived link to view the file; relative to the API origin when it starts with /" }
        expiry_state: { type: string, enum: [VALID, EXPIRING, EXPIRED, UNKNOWN, NOT_TRACKED] }
        days_left: { type: integer }
        renewal: { $ref: "#/components/schemas/Document", description: "A newer copy waiting for review (or rejected) beside this one" }
    DocumentInput:
      type: object
      required: [kind, file_key, content_type]
      properties:
        kind: { type: string }
        file_key: { type: string }
        content_type: { type: string }
        expires_on: { type: string, format: date, description: "Required when the country's type says so (expires_on REQUIRED); today or later (PAST), at most 10 years ahead (TOO_FAR)" }
    Requirement:
      type: object
      required: [kind, owner, label, done, mandatory, tracks_expiry, expiry_required]
      properties:
        kind: { type: string }
        owner: { type: string, enum: [DRIVER, VEHICLE] }
        label: { $ref: "#/components/schemas/LocalizedText" }
        done: { type: boolean }
        mandatory: { type: boolean, description: "Blocks sign-up until uploaded; optional ones never do" }
        tracks_expiry: { type: boolean }
        expiry_required: { type: boolean }
    DocumentType:
      type: object
      description: One document a country asks drivers for, as staff configure it.
      required: [country, kind, owner, label, requirement, tracks_expiry, expiry_required, blocks_when_expired, sort_order]
      properties:
        country: { type: string }
        kind: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,31}$" }
        owner: { type: string, enum: [DRIVER, VEHICLE] }
        label: { $ref: "#/components/schemas/LocalizedText" }
        requirement: { type: string, enum: [MANDATORY, OPTIONAL, OFF] }
        tracks_expiry: { type: boolean }
        expiry_required: { type: boolean, description: "The driver must give the expiry date (needs tracks_expiry)" }
        blocks_when_expired: { type: boolean, description: "An expired copy puts the driver on a DOCUMENT hold (needs tracks_expiry)" }
        sort_order: { type: integer }
    AdminDocument:
      type: object
      required: [driver_id, phone, kind, label, expiry_state, blocks_when_expired, mandatory]
      properties:
        driver_id: { type: string, format: uuid }
        driver_name: { type: string }
        phone: { type: string }
        plate: { type: string }
        kind: { type: string }
        label: { $ref: "#/components/schemas/LocalizedText" }
        document_id: { type: string, format: uuid }
        expires_on: { type: string, format: date }
        expiry_state: { type: string, enum: [VALID, EXPIRING, EXPIRED, UNKNOWN, NOT_TRACKED, MISSING] }
        days_left: { type: integer }
        renewal_id: { type: string, format: uuid }
        blocks_when_expired: { type: boolean }
        mandatory: { type: boolean }
    DriverDocuments:
      type: object
      required: [requirements, documents]
      properties:
        requirements: { type: array, items: { $ref: "#/components/schemas/Requirement" } }
        documents: { type: array, items: { $ref: "#/components/schemas/Document" } }
    Onboarding:
      type: object
      required: [profile, documents, requirements, missing, can_submit, can_edit]
      properties:
        profile: { $ref: "#/components/schemas/DriverProfile" }
        vehicle: { $ref: "#/components/schemas/Vehicle" }
        documents: { type: array, items: { $ref: "#/components/schemas/Document" } }
        requirements: { type: array, items: { $ref: "#/components/schemas/Requirement" } }
        missing: { type: array, items: { type: string }, description: "profile, vehicle, or document kinds" }
        can_submit: { type: boolean }
        can_edit: { type: boolean }
        licence_classes: { type: array, items: { type: string }, description: "The driver's country licence classes (empty = not asked)" }
        licence_pattern: { type: string, description: "Regular expression the licence number must match" }
    UploadTicket:
      type: object
      required: [file_key, upload_url, expires_at]
      properties:
        file_key: { type: string }
        upload_url: { type: string, description: "PUT the bytes here with the same Content-Type; relative to the API origin when it starts with /" }
        expires_at: { type: string, format: date-time }
    ReasonInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    DriverRow:
      allOf:
        - $ref: "#/components/schemas/DriverProfile"
        - type: object
          required: [trips_completed]
          properties:
            plate: { type: string }
            service: { type: string }
            vehicle_class: { type: string }
            rating: { type: number }
            trips_completed: { type: integer }
    DriverPage:
      type: object
      required: [data, total, counts]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/DriverRow" } }
        total: { type: integer }
        counts: { type: object, additionalProperties: { type: integer } }
    AuditEntry:
      type: object
      required: [id, action, target, data, at]
      properties:
        id: { type: integer }
        actor_id: { type: string, format: uuid }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        reason: { type: string }
        data: { type: object, additionalProperties: true }
        at: { type: string }
    AuditPage:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
    DriverDetail:
      allOf:
        - $ref: "#/components/schemas/Onboarding"
        - type: object
          required: [history]
          properties:
            history: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
    TrustedContact:
      type: object
      required: [name, phone]
      properties:
        name: { type: string }
        phone: { type: string }
    TrustedContactList:
      type: object
      required: [data]
      properties:
        data: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/TrustedContact" } }
    ShareLink:
      type: object
      required: [url, token]
      properties:
        url: { type: string }
        token: { type: string }
    SharedPlace:
      type: object
      required: [location]
      properties:
        location: { $ref: "#/components/schemas/Point" }
        address: { type: string }
    PublicTrip:
      type: object
      required: [code, status, rider_first_name, updated_at, ended]
      properties:
        code: { type: string }
        status: { $ref: "#/components/schemas/TripStatus" }
        rider_first_name: { type: string }
        driver_first_name: { type: string }
        vehicle: { type: string }
        pickup: { $ref: "#/components/schemas/SharedPlace" }
        dropoff: { $ref: "#/components/schemas/SharedPlace" }
        driver_location: { $ref: "#/components/schemas/Point" }
        updated_at: { type: string, format: date-time }
        ended: { type: boolean }
    SosAlert:
      type: object
      required: [id, trip_id, trip_code, user_id, contacts_alerted, created_at]
      properties:
        id: { type: string, format: uuid }
        trip_id: { type: string, format: uuid }
        trip_code: { type: string }
        user_id: { type: string, format: uuid }
        user_name: { type: string }
        user_phone: { type: string }
        lat: { type: number }
        lng: { type: number }
        contacts_alerted: { type: integer }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        resolution: { type: string }
    TripStats:
      type: object
      required: [since, requested, completed, cancelled, no_driver, active, scheduled, gross_fares, avg_fare, completion_rate, by_hour, previous]
      properties:
        since: { type: string, format: date-time }
        requested: { type: integer }
        completed: { type: integer }
        cancelled: { type: integer }
        no_driver: { type: integer }
        active: { type: integer }
        scheduled: { type: integer }
        gross_fares: { $ref: "#/components/schemas/Money" }
        avg_fare: { $ref: "#/components/schemas/Money" }
        completion_rate: { type: number }
        by_hour: { type: array, items: { type: object, required: [hour, requested, completed], properties: { hour: { type: string, format: date-time }, requested: { type: integer }, completed: { type: integer } } } }
        previous:
          description: The same window one day earlier, for "vs yesterday" comparisons.
          type: object
          required: [requested, completed, gross_fares]
          properties:
            requested: { type: integer }
            completed: { type: integer }
            gross_fares: { $ref: "#/components/schemas/Money" }
    FinanceSummary:
      type: object
      required: [currency, platform_revenue, vat_payable, levy_payable, drivers_owe, owed_to_drivers, rider_dues, gateway_clearing, ledger_entries]
      properties:
        currency: { type: string }
        platform_revenue: { $ref: "#/components/schemas/Money" }
        vat_payable: { $ref: "#/components/schemas/Money" }
        levy_payable: { $ref: "#/components/schemas/Money" }
        drivers_owe: { $ref: "#/components/schemas/Money" }
        owed_to_drivers: { $ref: "#/components/schemas/Money" }
        rider_dues: { $ref: "#/components/schemas/Money" }
        gateway_clearing: { $ref: "#/components/schemas/Money", description: "Collected at the payment gateway, not yet in the bank" }
        owed_to_riders: { $ref: "#/components/schemas/Money", description: "Fare money that arrived after its trip was settled another way; to refund" }
        ledger_entries: { type: integer }
        charges_payable:
          type: array
          description: Extra charges owed to third parties, per payee
          items:
            type: object
            required: [payee_id, name, kind, amount]
            properties:
              payee_id: { type: string, format: uuid }
              name: { type: string }
              kind: { type: string }
              amount: { $ref: "#/components/schemas/Money" }
    AdminOverview:
      type: object
      required: [trips, drivers_online, drivers_on_trip, open_sos, surge_areas]
      properties:
        trips: { $ref: "#/components/schemas/TripStats" }
        drivers_online: { type: integer }
        drivers_on_trip: { type: integer }
        driver_statuses: { type: object, additionalProperties: { type: integer } }
        open_sos: { type: integer }
        fraud_open: { type: integer, description: "Fraud flags waiting for review in the country" }
        privacy_overdue: { type: integer, description: "Privacy requests past their due date" }
        finance: { $ref: "#/components/schemas/FinanceSummary" }
        surge_areas: { type: integer }
    LiveDriver:
      type: object
      required: [driver_id, location, state, services, vehicle_classes, at, name]
      properties:
        driver_id: { type: string }
        name: { type: string }
        location: { $ref: "#/components/schemas/Point" }
        h3: { type: string }
        heading: { type: number }
        state: { type: string, enum: [IDLE, OFFERED, ON_TRIP] }
        services: { type: array, items: { type: string } }
        vehicle_classes: { type: array, items: { type: string } }
        trip_id: { type: string }
        at: { type: string, format: date-time }
    WaitingRequest:
      type: object
      required: [trip_id, code, service, vehicle_class, pickup, waiting_s]
      properties:
        trip_id: { type: string, format: uuid }
        code: { type: string }
        service: { type: string }
        vehicle_class: { type: string }
        pickup: { $ref: "#/components/schemas/Point" }
        waiting_s: { type: integer }
    AdminLive:
      type: object
      required: [drivers, requests, surge]
      properties:
        drivers: { type: array, items: { $ref: "#/components/schemas/LiveDriver" } }
        requests: { type: array, items: { $ref: "#/components/schemas/WaitingRequest" } }
        surge: { type: object, additionalProperties: { type: string }, description: "H3 res-7 cell → multiplier" }
    AdminTripPage:
      type: object
      required: [data, total]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Trip" } }
        total: { type: integer }
    AdminTripDetail:
      allOf:
        - $ref: "#/components/schemas/Trip"
        - type: object
          required: [events]
          properties:
            events: { type: array, items: { $ref: "#/components/schemas/TripEvent" } }
    UserRow:
      type: object
