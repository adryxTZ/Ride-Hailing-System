# Custom Postgres queries for Alloy's postgres exporter (postgres_exporter format).
# Metric name = <key>_<column>, e.g. pg_river_queue_jobs (used by rules/alerts.yml).
# The monitor role needs only SELECT on river_job (GRANT SELECT ON river_job TO <monitor>).

# Jobs waiting or in flight per queue and state: River queue depth.
pg_river_queue:
  query: |
    SELECT queue, state::text AS state, count(*)::float8 AS jobs
    FROM river_job
    WHERE state IN ('available', 'retryable', 'running', 'scheduled')
    GROUP BY queue, state
  metrics:
    - queue: { usage: LABEL, description: "River queue name" }
    - state: { usage: LABEL, description: "Job state" }
    - jobs: { usage: GAUGE, description: "Jobs in this queue and state" }

# Age of the oldest job ready to run: grows when workers are stuck or down.
pg_river_oldest_available:
  query: |
    SELECT coalesce(extract(epoch FROM now() - min(scheduled_at)), 0)::float8 AS seconds
    FROM river_job
    WHERE state = 'available'
  metrics:
    - seconds: { usage: GAUGE, description: "Seconds the oldest available job has waited" }

# Jobs that exhausted their retries in the last hour (payments, payouts, regulator).
pg_river_discarded_recent:
  query: |
    SELECT kind, count(*)::float8 AS jobs
    FROM river_job
    WHERE state = 'discarded' AND finalized_at > now() - interval '1 hour'
    GROUP BY kind
  metrics:
    - kind: { usage: LABEL, description: "Job kind" }
    - jobs: { usage: GAUGE, description: "Jobs discarded in the last hour" }
